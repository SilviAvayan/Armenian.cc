обь, вы номер даете?", "word": "բերում ա", "gloss": "выходит/показывает", "note": "от բերել (приносить): причастие բերում + вспом. ա [наст. вр., разг.]", "start": 62.479, "end": 68.57}, {"id": "n008", "handle": "lily_bagratuni", "url": "https://www.tiktok.com/@lily_bagratuni/video/7646105736002522389", "src": "https://videos.armenian.cc/video_lily_bagratuni_7646105736002522389.mp4", "seg_text": "Այնպես որ, անպայման պահպանեք այս բաղադրատոմսը, կիսվեք ձեր ամենամտերիմ մարդկանց հետ ու միացեք իմ հանր", "seg_translation": "Так что обязательно сохраните этот рецепт, поделитесь с самыми близкими людьми и присоединяйтесь к моему сообществу", "word": "կիսվեք", "gloss": "поделитесь", "note": "от կիսվել (делиться) [повелительное наклонение, 2 л. мн. ч.]", "start": 131.96, "end": 139.16}, {"id": "n009", "handle": "tnakan_baxadratomser", "url": "https://www.tiktok.com/@tnakan_baxadratomser/video/7652308309948550408", "src": "https://videos.armenian.cc/video_tnakan_baxadratomser_7652308309948550408.mp4", "seg_text": "Տարածում ենք ու մեր սիրելի մթերքները ավելացնում։", "seg_translation": "Распределяем и добавляем наши любимые продукты.", "word": "տարածում ենք", "gloss": "распределяем", "note": "от տարածել (распространять/размазывать): причастие տարածում + вспом. ենք [наст. вр.]", "start": 85.33, "end": 88.07}, {"id": "n010", "handle": "nor.ej_", "url": "https://www.tiktok.com/@nor.ej_/video/7645607013547838740", "src": "https://videos.armenian.cc/video_nor.ej__7645607013547838740.mp4", "seg_text": "Երազ տեսա էս գիշեր, էս գիշեր, էս գիշեր, քեզ անհամար կարապներ, կարապներ, կարապներ։", "seg_translation": "Сон видел этой ночью, этой ночью, этой ночью, [видел] тебя с бесчисленными лебедями, лебедями, лебедями.", "word": "տեսա", "gloss": "видел", "note": "от տեսնել (видеть) [прош. вр., 1 л. ед. ч.]", "start": 3.72, "end": 13.319}, {"id": "n011", "handle": "haykmarutyanofficial", "url": "https://www.tiktok.com/@haykmarutyanofficial/video/7647566577797254420", "src": "https://videos.armenian.cc/video_haykmarutyanofficial_7647566577797254420.mp4", "seg_text": "Նիկոլը հրաժարական չի տա, առանց հաց կմնամ, առանց լույս կմնամ, առանց գազ կմնամ։", "seg_translation": "Никол в отставку не уйдет, я останусь без хлеба, без света, без газа.", "word": "կմնամ", "gloss": "останусь", "note": "от մնալ (оставаться) [будущее вр., 1 л. ед. ч.]", "start": 9.8, "end": 15.92}, {"id": "n012", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7449053720966466823", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7449053720966466823.mp4", "seg_text": "Ես միայն մի բան պիտի ավելացնեմ, որ տասնյոթ տարեկանից կյանքս կապել եմ քեզ հետ և ավելի շատ ապրել եմ քեզ հետ, քան առանց քեզ, և, և սա ա փաստը։", "seg_translation": "Я только одно должна добавить, что с семнадцати лет связала свою жизнь с тобой и прожила с тобой больше, чем без тебя, и, и это факт.", "word": "պիտի ավելացնեմ", "gloss": "должна добавить", "note": "модальная частица «պիտի» + глагол [буд. вр.]", "start": 133.48, "end": 148.09}, {"id": "n013", "handle": "nor.ej_", "url": "https://www.tiktok.com/@nor.ej_/video/7645607013547838740", "src": "https://videos.armenian.cc/video_nor.ej__7645607013547838740.mp4", "seg_text": "Ախ, նստեմ ձեր թևերին կարապներ, կարապներ, ինձ իմ յարի մոտ տարեք, մի թողեք մանաման սեր", "seg_translation": "Ах, сяду вам на крылья, лебеди, лебеди, отнесите меня к моему возлюбленному, не дайте любви угаснуть", "word": "նստեմ", "gloss": "сяду", "note": "от նստել (сидеть/сесть) [сослаг. накл., 1 л. ед. ч.]", "start": 20.78, "end": 28.353}, {"id": "n014", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7647670834248600853", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7647670834248600853.mp4", "seg_text": "Իրականում էլի բաներ կար, որ կուզեի ասել, բայց խառնիճաղանջ ֆորմատը թույլ չէր տալիս, բայց ամենակարևորը ասացի, ասացի, որ սիրում եմ ձեզ՝ Հայաստանի Հանրապետության ժողովուրդ, սիրում եմ յուրաքանչյուրիդ, սիրում եմ Հայաստանի Հանրապետությունը։", "seg_translation": "На самом деле было еще много того, что я хотел бы сказать, но сумбурный формат не позволял, но самое важное я сказал: я сказал, что люблю вас, народ Республики Армения, люблю каждого из вас, люблю Республику Армения.", "word": "կուզեի", "gloss": "хотел бы", "note": "от ուզել (хотеть) [условное накл., 1 л. ед. ч.]", "start": 5.42, "end": 25.5}, {"id": "n015", "handle": "zhanna_jaan", "url": "https://www.tiktok.com/@zhanna_jaan/video/7655423811830992149", "src": "https://videos.armenian.cc/video_zhanna_jaan_7655423811830992149.mp4", "seg_text": "Գնաց։", "seg_translation": "Он/она ушел/ушла.", "word": "Գնաց", "gloss": "ушел", "note": "от գնալ (идти) [прош. время, 3 л. ед. ч.]", "start": 15.34, "end": 16.44}, {"id": "n016", "handle": "tnakan_baxadratomser", "url": "https://www.tiktok.com/@tnakan_baxadratomser/video/7652308309948550408", "src": "https://videos.armenian.cc/video_tnakan_baxadratomser_7652308309948550408.mp4", "seg_text": "Դե ինչ, անցել է արդեն քսանհինգ րոպե, պիցցաները հերթով տեղափոխում եմ ջեռոց ու արդեն մի փոքր սառելուց հետո կարող ենք կտրել ու վայելել։", "seg_translation": "Ну что, прошло уже двадцать пять минут, я по очереди перекладываю пиццы в духовку, и после того как они немного остынут, мы можем нарезать и наслаждаться.", "word": "անցել է", "gloss": "прошло", "note": "от անցնել (проходить) [прош. время, прош. соверш.]", "start": 144.71, "end": 153.37}, {"id": "n017", "handle": "bazhukovfamily", "url": "https://www.tiktok.com/@bazhukovfamily/video/7664467996794014996", "src": "https://videos.armenian.cc/video_bazhukovfamily_7664467996794014996.mp4", "seg_text": "Ցավոք իմ հեռախոսը, որով ընկարախանված են գրեթե բոլոր մեր ռոլիկները, սկսել է մռնալ:", "seg_translation": "К сожалению, мой телефон, на который сняты почти все наши ролики, начал барахлить.", "word": "սկսել է", "gloss": "начал", "note": "от սկսել (начать) [прош. вр., перфект]", "start": 34.359, "end": 42.959}, {"id": "n018", "handle": "19aistudio", "url": "https://www.tiktok.com/@19aistudio/video/7647950805101727008", "src": "https://videos.armenian.cc/video_19aistudio_7647950805101727008.mp4", "seg_text": "Իսկ եթե հանդիպի մեր գազարներին։", "seg_translation": "А если встретит наши морковки.", "word": "հանդիպի", "gloss": "встретит", "note": "от հանդիպել (встречать) [сослагат. накл., 3 л. ед. ч.]", "start": 52.639, "end": 55.099}, {"id": "n019", "handle": "dr..aghasi.sharba", "url": "https://www.tiktok.com/@dr..aghasi.sharba/video/7655390302001171732", "src": "https://videos.armenian.cc/video_dr..aghasi.sharba_7655390302001171732.mp4", "seg_text": "Սկսեց գալիս է։", "seg_translation": "Начинает появляться.", "word": "Սկսեց", "gloss": "начал", "note": "от սկսել [прош. время, 3 л. ед. ч.]", "start": 0.0, "end": 2.68}, {"id": "n020", "handle": "armenian_foodblog", "url": "https://www.tiktok.com/@armenian_foodblog/video/7647217106466999572", "src": "https://videos.armenian.cc/video_armenian_foodblog_7647217106466999572.mp4", "seg_text": "Առաջնային առանձնացնում ենք դեղնուցը և սպիտակուցը։", "seg_translation": "Первым делом отделяем желток и белок.", "word": "դեղնուցը", "gloss": "желток", "note": "от դեղին (жёлтый) + ուց (суффикс сущ. с таким качеством) + опред. артикль -ը", "start": 5.799, "end": 8.46}, {"id": "n021", "handle": "_._k_a_l_p_a_._", "url": "https://www.tiktok.com/@_._k_a_l_p_a_._/video/7670249705992899861", "src": "https://videos.armenian.cc/video__._k_a_l_p_a_.__7670249705992899861.mp4", "seg_text": "Յոթ տարի ա ինքը ստեղ ա ապրում:", "seg_translation": "Семь лет она живет здесь.", "word": "ստեղ", "gloss": "здесь", "note": "сокращение от այստեղ [разг.]", "start": 24.279, "end": 26.539}, {"id": "n022", "handle": "wowwaaan", "url": "https://www.tiktok.com/@wowwaaan/video/7651530770485382418", "src": "https://videos.armenian.cc/video_wowwaaan_7651530770485382418.mp4", "seg_text": "Էսի, ո՞ւտի գոմը, արի ո՞րն եմ սեղմում:", "seg_translation": "Это, куда в хлев? Иди сюда, что я нажимаю?", "word": "ո՞րն եմ սեղմում", "gloss": "что я нажимаю", "note": "ո՞րն (что/какое) + եմ սեղմում (я нажимаю, от սեղմել)", "start": 11.439, "end": 14.96}, {"id": "n023", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7562576540278508820", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7562576540278508820.mp4", "seg_text": "Ո՞նց ա բերքդ էս տարի։", "seg_translation": "Как у тебя урожай в этом году?", "word": "Ո՞նց", "gloss": "как", "note": "сокращение от ինչպե՞ս [разг.]", "start": 5.68, "end": 7.279}, {"id": "n024", "handle": "lil_lil_99", "url": "https://www.tiktok.com/@lil_lil_99/video/7654070930196450593", "src": "https://videos.armenian.cc/video_lil_lil_99_7654070930196450593.mp4", "seg_text": "Համովա՞կ է անգամ:", "seg_translation": "Вкусно ли?", "word": "Համովա՞կ", "gloss": "вкусненько", "note": "от համով (вкусный) + уменьшит. суффикс [разг.]", "start": 74.46, "end": 76.24}, {"id": "n025", "handle": "gorrkarapetyan", "url": "https://www.tiktok.com/@gorrkarapetyan/video/7665759107466464532", "src": "https://videos.armenian.cc/video_gorrkarapetyan_7665759107466464532.mp4", "seg_text": "Ուտենք, խմենք, լավ քեֆ անենք էս գիշեր", "seg_translation": "Давайте поедим, выпьем, хорошо повеселимся этой ночью", "word": "քեֆ անենք", "gloss": "повеселимся", "note": "составной глагол, буквально «делать кеф» [повел. накл., 1 л. мн. ч.]", "start": 36.419, "end": 39.174}, {"id": "n026", "handle": "bazhukovfamily", "url": "https://www.tiktok.com/@bazhukovfamily/video/7661153418660138261", "src": "https://videos.armenian.cc/video_bazhukovfamily_7661153418660138261.mp4", "seg_text": "Ես Հայրիկ Յուրան եմ, լուսանկարիչ, վիդեոգրաֆ, մարտական ցուլասնկարչություն եմ զբաղվում։", "seg_translation": "Я папа Юра, фотограф, видеограф, занимаюсь боевой фотографией.", "word": "Հայրիկ", "gloss": "папа", "note": "ласкательная форма от հայր (отец)", "start": 24.479, "end": 30.68}, {"id": "n027", "handle": "ninana_yan", "url": "https://www.tiktok.com/@ninana_yan/video/7658915234333166866", "src": "https://videos.armenian.cc/video_ninana_yan_7658915234333166866.mp4", "seg_text": "Ես պրոբլեմ չունիմ իմ կողքին եմ տատին, նոր վերնգիր սարսափը, տատին ձեպ է գտպատին:", "seg_translation": "У меня нет проблем, рядом со мной бабушка, новый заголовок — ужас, бабушка (загадочный контекст).", "word": "կողքին", "gloss": "рядом", "note": "от կողք (сторона) + суффикс принадлежности [местный падеж]", "start": 0.0, "end": 7.599}, {"id": "n028", "handle": "novax3160", "url": "https://www.tiktok.com/@novax3160/video/7666173171308989728", "src": "https://videos.armenian.cc/video_novax3160_7666173171308989728.mp4", "seg_text": "Բոլոր ընկերներս գնում են։", "seg_translation": "Все мои друзья уходят.", "word": "ընկերներս", "gloss": "мои друзья", "note": "от ընկեր + притяжательный суффикс -ս [мн. ч.]", "start": 12.14, "end": 14.06}, {"id": "n029", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7624895708490992903", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7624895708490992903.mp4", "seg_text": "Երանիներ. երանի հոգով աղքատներին, որովհետև նրանցն է երկնքի արքայությունը:", "seg_translation": "Блаженны нищие духом, ибо их есть Царство Небесное.", "word": "Երանիներ", "gloss": "блаженства", "note": "мн. ч. от երանի (блаженство)", "start": 16.239, "end": 23.459}, {"id": "n030", "handle": "ani_zaqaryan_", "url": "https://www.tiktok.com/@ani_zaqaryan_/video/7180665713583983873", "src": "https://videos.armenian.cc/video_ani_zaqaryan__7180665713583983873.mp4", "seg_text": "Եվ ոչ թե ստեսություն ձեզ, այլ ցտեսություն, պարզապես ցտեսություն։", "seg_translation": "И не «стесутюн» вам, а «цтесутюн», просто «цтесутюн».", "word": "պարզապես", "gloss": "просто", "note": "наречие от պարզ (простой, ясный)", "start": 7.44, "end": 13.014}, {"id": "n031", "handle": "oravarc.am", "url": "https://www.tiktok.com/@oravarc.am/video/7659812444029635848", "src": "https://videos.armenian.cc/video_oravarc.am_7659812444029635848.mp4", "seg_text": "Շոգ ա, շոգ ա, մամա ջան, շատ շոգ ա, շոգ ա", "seg_translation": "Жарко, жарко, мамочка, очень жарко, жарко", "word": "շոգ ա", "gloss": "жарко", "note": "сокращение от շոգ է [разг.]", "start": 63.899, "end": 68.767}, {"id": "n032", "handle": "ashot_hvns", "url": "https://www.tiktok.com/@ashot_hvns/video/7652741026481704213", "src": "https://videos.armenian.cc/video_ashot_hvns_7652741026481704213.mp4", "seg_text": "Այ էն բայղուշ Կարինան խի՞ էր ասում, իբր գնալու են Հայաստանից, դատարկվելու ա Հայաստանը, էլ հետ չգան:", "seg_translation": "А почему та бедняжка Карина говорила, будто они уедут из Армении, Армения опустеет и они не вернутся?", "word": "խի՞", "gloss": "почему", "note": "разговорная форма от ինչու [разг.]", "start": 52.439, "end": 58.439}, {"id": "n033", "handle": "asatryangurgen_", "url": "https://www.tiktok.com/@asatryangurgen_/video/7643116752305507591", "src": "https://videos.armenian.cc/video_asatryangurgen__7643116752305507591.mp4", "seg_text": "Հա, որովհետև- Մեր խալաձենիկը կյանքում սենց չի եղել, մեր սեղանները կյանքում սենց լիքը չի եղել, ինչ էսի եկել ա, դու սկսել ես էդ ուտող, ուրացող։", "seg_translation": "Да, потому что... Наш кузен в жизни таким не был, наши столы в жизни не были такими полными, с тех пор как этот пришел, ты начала [быть] этой едящей, предающей.", "word": "սենց", "gloss": "такой/так", "note": "сокращение от այսպես [разг.]", "start": 19.739, "end": 30.659}, {"id": "n034", "handle": "vdrum_", "url": "https://www.tiktok.com/@vdrum_/video/7652016503071591698", "src": "https://videos.armenian.cc/video_vdrum__7652016503071591698.mp4", "seg_text": "Եթե ճիշտ արեցիր, էս իմն ա։", "seg_translation": "Если сделал правильно, это моё.", "word": "էս", "gloss": "это", "note": "сокращение от այս [разг.]", "start": 36.04, "end": 39.68}, {"id": "n035", "handle": "harutyunyans_blog", "url": "https://www.tiktok.com/@harutyunyans_blog/video/7667505587961351445", "src": "https://videos.armenian.cc/video_harutyunyans_blog_7667505587961351445.mp4", "seg_text": "Խոյ, function draw(){const done=DATA.filter(x=>R[x.id]&&R[x.id].verdict).length;document.getElementById('prog').style.width=(100*done/DATA.length)+'%';document.getElementById('count').textContent=done+'/'+DATA.length;
const it=DATA[i],r=R[it.id]||{};
document.getElementById('app').innerHTML=`<div class="card"><div class="small">note ${i+1}/${DATA.length} · @${it.handle||''} · <button class="play" id="pl">▶ audio</button></div>
<div class="am">${it.word}</div><div class="gloss">gloss: “${it.gloss||''}”</div>
<div class="ctx">${hl(it.seg_text,it.word)}<br><span class="small">${it.seg_translation||''}</span></div>
<div class="note">📝 model note: ${it.note}</div>
<div class="q">Is this note (the grammatical / etymological / register claim) correct?</div>
<div class="btns">
<button class="opt ok ${r.verdict==='correct'?'sel':''}" onclick="setV('${it.id}','correct')">✓ Correct (1)</button>
<button class="opt part ${r.verdict==='partial'?'sel':''}" onclick="setV('${it.id}','partial')">◐ Partly (2)</button>
<button class="opt bad ${r.verdict==='wrong'?'sel':''}" onclick="setV('${it.id}','wrong')">✗ Wrong (3)</button>
<button class="opt sk ${r.verdict==='unsure'?'sel':''}" onclick="setV('${it.id}','unsure')">? Unsure (4)</button></div>
<textarea id="fix" placeholder="what's wrong / correct claim (if partly/wrong)">${(r.correction||'').replace(/</g,'&lt;')}</textarea>
<div class="small" style="margin-top:6px"><a href="${it.url}" target="_blank">↗ open TikTok</a></div>
<div class="nav"><button onclick="go(-1)">← Prev</button><button class="primary" onclick="go(1)">Next →</button></div></div>`;
document.getElementById('pl').onclick=()=>play(it);
document.getElementById('fix').oninput=e=>{R[it.id]={...(R[it.id]||{}),correction:e.target.value};localStorage.setItem(KEY,JSON.stringify(R));};}
function go(d){au.pause();i=Math.max(0,Math.min(DATA.length-1,i+d));draw();scrollTo(0,0);}
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;const it=DATA[i];if(e.key==='1')setV(it.id,'correct');if(e.key==='2')setV(it.id,'partial');if(e.key==='3')setV(it.id,'wrong');if(e.key==='4')setV(it.id,'unsure');if(e.key==='p'||e.key==='P')play(it);if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
function exportJSON(){const out={labeled_at:new Date().toISOString(),labels:R};const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='note_labels.json';a.click();}
draw();</script></body></html>
