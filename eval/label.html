<style>
 :root{--bg:#0f1115;--card:#1a1d24;--fg:#e8eaed;--mut:#9aa0aa;--ok:#3fb950;
   --warn:#d29922;--bad:#f85149;--acc:#58a6ff;--line:#2b2f38}
 *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
   font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
 header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
   padding:12px 20px;display:flex;gap:16px;align-items:center;z-index:5}

 .bar{flex:1;height:8px;background:var(--card);border-radius:6px;overflow:hidden}
 .bar>i{display:block;height:100%;background:var(--acc);width:0}
 .wrap{max-width:760px;margin:0 auto;padding:20px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
   padding:20px;margin:14px 0}
 .tag{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
 .am{font-size:30px;font-weight:600;margin:6px 0}
 .ctx{color:var(--mut);font-size:15px;margin:8px 0;padding:10px;background:#0d0f13;

 .ctx b{color:var(--fg);background:#33415e;padding:1px 5px;border-radius:4px}
 .gloss{font-size:22px;color:var(--acc);margin:10px 0}
 .note{font-size:13px;color:var(--warn);margin:6px 0}
 .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
 button.opt{flex:1;min-width:110px;padding:12px;border-radius:9px;border:1px solid var(--line);
   background:#20242d;color:var(--fg);cursor:pointer;font-size:15px}
 button.opt:hover{border-color:var(--acc)}
 button.opt.sel{outline:2px solid #fff}
 .ok{background:#12331c;border-color:var(--ok)} .acc{background:#3a3212;border-color:var(--warn)}
 .bad{background:#3a1615;border-color:var(--bad)} .skip{background:#20242d}
 .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
 input[type=text]{flex:1;min-width:200px;padding:10px;border-radius:8px;border:1px solid var(--line);
   background:#0d0f13;color:var(--fg);font-size:15px}
 label.chk{font-size:14px;color:var(--mut);display:flex;gap:6px;align-items:center}
 .audio{display:flex;gap:8px;align-items:center;margin:8px 0}
 .play{padding:8px 14px;border-radius:8px;border:1px solid var(--acc);background:#12233b;
   color:var(--acc);cursor:pointer}
 .nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
 .nav button{padding:12px 20px;border-radius:9px;border:1px solid var(--line);

 .primary{background:var(--acc)!important;color:#000!important;font-weight:600}
 a{color:var(--acc)} .small{font-size:12px;color:var(--mut)}

<script>
const DATA = {"words": [{"id": "w000", "video_id": "ani_zaqaryan__7377021572281830672", "handle": "ani_zaqaryan_", "url": "https://www.tiktok.com/@ani_zaqaryan_/video/7377021572281830672", "src": "https://videos.armenian.cc/video_ani_zaqaryan__7377021572281830672.mp4", "seg_text": "Ընկերներ, ուրեմն անդրադառնանք երեկվա հարցին։", "seg_explanation": "Друзья, давайте вернемся к вчерашнему вопросу.", "word": "անդրադառնանք", "gloss": "обратимся", "note": "от անդրադառնալ (возвращаться к теме) [сослагательное накл., 1 л. мн. ч.]", "start": 1.779, "end": 2.5}, {"id": "w001", "video_id": "lily_bagratuni_7646105736002522389", "handle": "lily_bagratuni", "url": "https://www.tiktok.com/@lily_bagratuni/video/7646105736002522389", "src": "https://videos.armenian.cc/video_lily_bagratuni_7646105736002522389.mp4", "seg_text": "Խմորը բացում եմ, ինչպես ձեզ ցույց տվեցի, հետո այսպես կլորավուն գնդում եմ և կարը դեպի ներքև շրջում։", "seg_explanation": "Тесто я раскатываю, как вам показал, потом так округло скатываю и шов переворачиваю вниз.", "word": "շրջում։", "gloss": "Так", "note": "от շրջել (переворачивать): причастие շրջում + вспом. եմ [наст. вр.]", "start": 57.02, "end": 57.44}, {"id": "w002", "video_id": "19aistudio_7650534482725948705", "handle": "19aistudio", "url": "https://www.tiktok.com/@19aistudio/video/7650534482725948705", "src": "https://videos.armenian.cc/video_19aistudio_7650534482725948705.mp4", "seg_text": "Ես քեզ չեմ մոռացել:", "seg_explanation": "Я тебя не забыл.", "word": "քեզ", "gloss": "тебя", "note": null, "start": 77.18, "end": 77.379}, {"id": "w003", "video_id": "_dianavoskanyan_7652653653781826824", "handle": "_dianavoskanyan", "url": "https://www.tiktok.com/@_dianavoskanyan/video/7652653653781826824", "src": "https://videos.armenian.cc/video__dianavoskanyan_7652653653781826824.mp4", "seg_text": "Գորիսում մենք չենք ասում. «Էս ի՞նչ ա հագածդ, քեզ վաբշե չի սազում»:", "seg_explanation": "В Горисе мы не говорим: «Что это на тебе надето, тебе вообще не идет».", "word": "քեզ", "gloss": "тебе", "note": null, "start": 2.599, "end": 2.759}, {"id": "w004", "video_id": "karcomedy_7649676656868625685", "handle": "karcomedy", "url": "https://www.tiktok.com/@karcomedy/video/7649676656868625685", "src": "https://videos.armenian.cc/video_karcomedy_7649676656868625685.mp4", "seg_text": "Կպչուն հյութը ամբողջովին դեմքիդ է կսվում:", "seg_explanation": "Липкий сок полностью размазывается по твоему лицу.", "word": "է", "gloss": "размазывается по твоему лицу", "note": null, "start": 15.979, "end": 16.02}, {"id": "w005", "video_id": "ai__genius_7654117719167585569", "handle": "ai__genius", "url": "https://www.tiktok.com/@ai__genius/video/7654117719167585569", "src": "https://videos.armenian.cc/video_ai__genius_7654117719167585569.mp4", "seg_text": "Մոսո, ինձ գոնե մի հատ ռոմանտիկ բան ասա։", "seg_explanation": "Мосо, скажи мне хотя бы что-нибудь романтичное.", "word": "ինձ", "gloss": "мне", "note": "от ես (я) [дат. п.]", "start": 1.019, "end": 1.179}, {"id": "w006", "video_id": "zhanna_jaan_7668233361306995988", "handle": "zhanna_jaan", "url": "https://www.tiktok.com/@zhanna_jaan/video/7668233361306995988", "src": "https://videos.armenian.cc/video_zhanna_jaan_7668233361306995988.mp4", "seg_text": "Բա հիմա ես իմեր հայ շոր ժամը մեկն է, Դուք հեչ ասել են Նարեի մերը դուրսն է, ինչ ամոթ է, ինչ կարծիք է հանել խայտառակություն։", "seg_explanation": "И вот сейчас час ночи, вы хоть сказали, что мама Наре на улице, какой стыд, какой позор.", "word": "է,", "gloss": "на улице", "note": null, "start": 107.88, "end": 107.9}, {"id": "w007", "video_id": "nayeqaxchiknerjan_7665802440767294728", "handle": "nayeqaxchiknerjan", "url": "https://www.tiktok.com/@nayeqaxchiknerjan/video/7665802440767294728", "src": "https://videos.armenian.cc/video_nayeqaxchiknerjan_7665802440767294728.mp4", "seg_text": "Էս ավարտին արևը և պիասի շողերը, թե չէ կասկած, չի երևի քեզ մեջն ի անձրևում կամ լի։", "seg_explanation": "В этом финале солнце и лучи песни, если нет сомнений, не видны в тебе ни в дожде, ни в чем-либо еще.", "word": "քեզ", "gloss": "тебе", "note": null, "start": 84.38, "end": 84.66}, {"id": "w008", "video_id": "delavdegij_7665453647853079829", "handle": "delavdegij", "url": "https://www.tiktok.com/@delavdegij/video/7665453647853079829", "src": "https://videos.armenian.cc/video_delavdegij_7665453647853079829.mp4", "seg_text": "Գուցե իմ սրտում, երգերում իմ մուն, խոսքերում ասված իմ հոգու մասին, հեռավոր մեկի անհնչարկն եմ սյուն, նետված աշխարհի անսուրբ երազին:", "seg_explanation": "Может быть, в моем сердце, в моих песнях, в словах, сказанных о моей душе, я — беззвучный столп кого-то далекого, брошенный в нечистый сон мира.", "word": "Գուցե", "gloss": "может быть", "note": "частица, выражающая сомнение [вводное слово]", "start": 0.439, "end": 0.859}, {"id": "w009", "video_id": "scorpion_1lovee_7657507766118010120", "handle": "scorpion_1lovee", "url": "https://www.tiktok.com/@scorpion_1lovee/video/7657507766118010120", "src": "https://videos.armenian.cc/video_scorpion_1lovee_7657507766118010120.mp4", "seg_text": "Հանգստացիր, Ռուզանի տատն ա։", "seg_explanation": "Успокойся, это бабушка Рузан.", "word": "ա։", "gloss": "бабушка", "note": null, "start": 13.039, "end": 13.699}, {"id": "w010", "video_id": "__hellsaa_7670213101031083284", "handle": "__hellsaa", "url": "https://www.tiktok.com/@__hellsaa/video/7670213101031083284", "src": "https://videos.armenian.cc/video___hellsaa_7670213101031083284.mp4", "seg_text": "Ուրիշների հետ է նա անցնում, ուրիշների սեր է նա խնդրում:", "seg_explanation": "С другими он проходит, у других он любви просит.", "word": "է", "gloss": "просит", "note": null, "start": 9.559, "end": 9.719}, {"id": "w011", "video_id": "aimusicx_01_7651850146090634503", "handle": "aimusicx_01", "url": "https://www.tiktok.com/@aimusicx_01/video/7651850146090634503", "src": "https://videos.armenian.cc/video_aimusicx_01_7651850146090634503.mp4", "seg_text": "Չէ, սա ոնց պիտի գրենք, չգիտի ոչ մեկ։", "seg_explanation": "Нет, как нам это писать, никто не знает.", "word": "չգիտի", "gloss": "не знает", "note": "от չ + գիտել (знать) [наст. вр., 3 л. ед. ч.]", "start": 5.299, "end": 5.859}, {"id": "w012", "video_id": "nikol.pashinyan_pm_7449053720966466823", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7449053720966466823", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7449053720966466823.mp4", "seg_text": "Դե չգիտեմ, քանի որ էդ իմ գրառման ներքո հարց էր ծագել, էսքանը ասենք, եզրակացությունները թողնենք հանրությանը, հա՞։", "seg_explanation": "Ну не знаю, раз уж под моим постом возник вопрос, давайте скажем это, а выводы оставим общественности, да?", "word": "հա՞։", "gloss": "да", "note": null, "start": 129.039, "end": 129.44}, {"id": "w013", "video_id": "blognewsarm_7662354589777235220", "handle": "blognewsarm", "url": "https://www.tiktok.com/@blognewsarm/video/7662354589777235220", "src": "https://videos.armenian.cc/video_blognewsarm_7662354589777235220.mp4", "seg_text": "Տասներեքամյա աղջիկը, ով ակտիվորեն զբաղվում էր ֆուտբոլով, մահացել է։", "seg_explanation": "Тринадцатилетняя девочка, которая активно занималась футболом, скончалась.", "word": "ֆուտբոլով,", "gloss": "футболом", "note": "от ֆուտբոլ [твор. п.]", "start": 14.799, "end": 15.259}, {"id": "w014", "video_id": "nikol.pashinyan_pm_7449053720966466823", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7449053720966466823", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7449053720966466823.mp4", "seg_text": "Եթե էդ հայտարարագիրը հանենք, ուրիշ տենց պաշտոնական թուղթ չկա, և սրա մասին մեր կյանքի երևի վերջին քսան տարում անընդհատ մամուլում գրվել ա, հրապարակվել ա, հարցազրույցներում ասվել ա, ըըը և էդքանը։", "seg_explanation": "Если убрать эту декларацию, другого такого официального документа нет, и об этом последние двадцать лет нашей жизни постоянно писали в прессе, публиковали, говорили в интервью, и всё на этом.", "word": "ա,", "gloss": "писалось", "note": null, "start": 103.58, "end": 103.64}, {"id": "w015", "video_id": "haykmarutyanofficial_7629414537296579860", "handle": "haykmarutyanofficial", "url": "https://www.tiktok.com/@haykmarutyanofficial/video/7629414537296579860", "src": "https://videos.armenian.cc/video_haykmarutyanofficial_7629414537296579860.mp4", "seg_text": "Հուստա էս էլ փոխի, էսի չես լսում։", "seg_explanation": "Мастер, поменяй и это, ты же это не слушаешь.", "word": "փոխի,", "gloss": "поменяй", "note": "от փոխել (менять) [пов. накл., 2 л. ед. ч.]", "start": 16.159, "end": 16.459}, {"id": "w016", "video_id": "nikol.pashinyan_pm_7624895708490992903", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7624895708490992903", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7624895708490992903.mp4", "seg_text": "Սիրելի ժողովուրդ, մեր Տեր և Փրկիչ Հիսուս Քրիստոսի հրաշափառ հարության սուրբ զատկի ջրագալույց է, և ես ցանկանում եմ բոլորիդ Սուրբ Զատիկը շնորհավորել Հիսուս Քրիստոսի երանիներով՝ Մատթեոսի Ավետարանից:", "seg_explanation": "Возлюбленный народ, сегодня канун Святой Пасхи, преславного Воскресения Господа и Спасителя нашего Иисуса Христа, и я хочу поздравить всех вас с Пасхой словами блаженств Иисуса Христа из Евангелия от Матфея.", "word": "բոլորիդ", "gloss": "всех вас", "note": null, "start": 9.8, "end": 10.399}, {"id": "w017", "video_id": "sssarrgalls_7651238432441699602", "handle": "sssarrgalls", "url": "https://www.tiktok.com/@sssarrgalls/video/7651238432441699602", "src": "https://videos.armenian.cc/video_sssarrgalls_7651238432441699602.mp4", "seg_text": "Էդքան էլ մտածելիս որովհետև արա Բայց ասեցիր չենք խմում Ես էլ ասեցի չենք խմում Ու վիտոգի ի՞նչ եղավ որ Վիտոգի էն եղավ որ հիմա հելել իմ վրա ես մունաթար Իմ վրա մունաթար Արդեն իմ վրա ուզում ես մունաթար է Ու՞ր ես էթում Ուր ուզում եմ էն էլ էթում եմ Դե գնա ապեր գնա ես էլ էի անեմ էթում Ուր ուզում ես գնա Դե դու էլ հելի գնա։", "seg_explanation": "Ну и о чем тут так много думать? Ты же сам сказал, что мы не пьем. И я сказал, что мы не пьем. И в итоге что произошло? В итоге получилось так, что теперь ты на меня наезжаешь. На меня наезжаешь? Ты уже хочешь на меня наехать? Куда ты идешь? Куда хочу, туда и иду. Ну и иди, брат, иди, я тоже собирался идти. Куда хочешь, туда и иди. Ну и ты вставай и иди.", "word": "անեմ", "gloss": "сделаю", "note": null, "start": 10.479, "end": 10.659}, {"id": "w018", "video_id": "qristin77_7666840740512763154", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7666840740512763154", "src": "https://videos.armenian.cc/video_qristin77_7666840740512763154.mp4", "seg_text": "Բա էս ինչ անասուն ծնունդ է էս աղջի, տենց բան են անում աղջի։", "seg_explanation": "Что это за ненормальное рождение, девушка, так ведь не делают, девушка.", "word": "էս", "gloss": "эта", "note": null, "start": 32.34, "end": 32.419}, {"id": "w019", "video_id": "hovhannisyanaa_7646148058505399572", "handle": "hovhannisyanaa", "url": "https://www.tiktok.com/@hovhannisyanaa/video/7646148058505399572", "src": "https://videos.armenian.cc/video_hovhannisyanaa_7646148058505399572.mp4", "seg_text": "Մեկը հունիսի մեկը հունիսի։", "seg_explanation": "Первое июня, первое июня.", "word": "մեկը", "gloss": "первое", "note": "от մեկ (один) [им. п., опред. арт.]", "start": 25.18, "end": 25.599}, {"id": "w020", "video_id": "nushohanian_7644323178126380321", "handle": "nushohanian", "url": "https://www.tiktok.com/@nushohanian/video/7644323178126380321", "src": "https://videos.armenian.cc/video_nushohanian_7644323178126380321.mp4", "seg_text": "Ուշ է, ուշ է, գալու են քեզ սրսկեն, հա։", "seg_explanation": "Уже поздно, поздно, придут делать тебе укол, да.", "word": "է,", "gloss": "есть", "note": null, "start": 20.6, "end": 20.76}, {"id": "w021", "video_id": "nikol.pashinyan_pm_7669641722917293330", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7669641722917293330", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7669641722917293330.mp4", "seg_text": "Սիրտը սիրուն դաշտ ում է, սիրո էхиդ մաշտ ում է, ինչո՞ւ, ինչո՞ւ ես իմ յարի սիրենցի", "seg_explanation": "Сердце — красивое поле, любовь — его путь, почему же, почему ты, моя возлюбленная, полюбила?", "word": "յարի", "gloss": "возлюбленной", "note": "от յար (возлюбленный/ая) [род. п., ед. ч.]", "start": 12.46, "end": 13.159}, {"id": "w022", "video_id": "gevgrig1_7650890993901817109", "handle": "gevgrig1", "url": "https://www.tiktok.com/@gevgrig1/video/7650890993901817109", "src": "https://videos.armenian.cc/video_gevgrig1_7650890993901817109.mp4", "seg_text": "Ժողովուրդ, սով արյուն ա ղրկում, իրան մի հատ մեծ առյուծ եմ տատու անում, զամ եմ որպեսզի։", "seg_explanation": "Народ, этот кровь пускает, я делаю ему тату большого льва, чтобы (все) было круто.", "word": "իրան", "gloss": "ему", "note": null, "start": 52.459, "end": 52.659}, {"id": "w023", "video_id": "hoquqaravan_7647211997389491476", "handle": "hoquqaravan", "url": "https://www.tiktok.com/@hoquqaravan/video/7647211997389491476", "src": "https://videos.armenian.cc/video_hoquqaravan_7647211997389491476.mp4", "seg_text": "Աչքերս վերցրու քեզ, զգան ինչ զգում եմ ես, տես իմ կյանքը, տես բոլորին ու տես քեզ:", "seg_explanation": "Возьми мои глаза себе, пусть они почувствуют то, что чувствую я, посмотри на мою жизнь, посмотри на всех и посмотри на себя.", "word": "զգան", "gloss": "пусть почувствуют", "note": "от զգալ (чувствовать) [сослаг. накл., 3 л. мн. ч.]", "start": 12.039, "end": 12.42}, {"id": "w024", "video_id": "narek.7071_7646446372966845714", "handle": "narek.7071", "url": "https://www.tiktok.com/@narek.7071/video/7646446372966845714", "src": "https://videos.armenian.cc/video_narek.7071_7646446372966845714.mp4", "seg_text": "Ինձ ասում են դու ես էս մաֆիայի դոնը, մութ ու ցուրտ ես ու համարյա լույս չկաս։", "seg_explanation": "Мне говорят, что ты дон этой мафии, ты тьма и холод, и света почти нет.", "word": "չկաս։", "gloss": "нет", "note": "от չլինել (не быть/не существовать): отрицательная форма 2-го л. ед. ч.", "start": 44.479, "end": 45.2}, {"id": "w025", "video_id": "vaag_mk_7626369781670710536", "handle": "vaag_mk", "url": "https://www.tiktok.com/@vaag_mk/video/7626369781670710536", "src": "https://videos.armenian.cc/video_vaag_mk_7626369781670710536.mp4", "seg_text": "Էս Հարվերդս դպրոցի մոտ եմ:", "seg_explanation": "Я здесь, возле школы Гарвардс.", "word": "Էս", "gloss": "Этот", "note": null, "start": 30.619, "end": 30.719}, {"id": "w026", "video_id": "delavdegij_7665453647853079829", "handle": "delavdegij", "url": "https://www.tiktok.com/@delavdegij/video/7665453647853079829", "src": "https://videos.armenian.cc/video_delavdegij_7665453647853079829.mp4", "seg_text": "Գուցե իմ սրտում, երգերում իմ մուն, խոսքերում ասված իմ հոգու մասին, հեռավոր մեկի անհնչարկն եմ սյուն, նետված աշխարհի անսուրբ երազին:", "seg_explanation": "Может быть, в моем сердце, в моих песнях, в словах, сказанных о моей душе, я — беззвучный столп кого-то далекого, брошенный в нечистый сон мира.", "word": "նետված", "gloss": "брошенная", "note": "от նետել (бросать) [причастие прош. вр., страдательный залог]", "start": 10.699, "end": 11.199}, {"id": "w027", "video_id": "ashot_hvns_7652741026481704213", "handle": "ashot_hvns", "url": "https://www.tiktok.com/@ashot_hvns/video/7652741026481704213", "src": "https://videos.armenian.cc/video_ashot_hvns_7652741026481704213.mp4", "seg_text": "Ապրես իր ջան, ապրես, ցավդ տանեմ:", "seg_explanation": "Спасибо, дорогой, спасибо, не болей.", "word": "ջան,", "gloss": "дорогой", "note": null, "start": 81.199, "end": 81.419}, {"id": "w028", "video_id": "vahanlorecyan_7627411232991005973", "handle": "vahanlorecyan", "url": "https://www.tiktok.com/@vahanlorecyan/video/7627411232991005973", "src": "https://videos.armenian.cc/video_vahanlorecyan_7627411232991005973.mp4", "seg_text": "Գիտեմ, որ դրանցից ոչ մեկը զուր չէ։", "seg_explanation": "Знаю, что ничто из этого не напрасно.", "word": "չէ։", "gloss": "не", "note": null, "start": 16.76, "end": 17.68}, {"id": "w029", "video_id": "vdrum__7652016503071591698", "handle": "vdrum_", "url": "https://www.tiktok.com/@vdrum_/video/7652016503071591698", "src": "https://videos.armenian.cc/video_vdrum__7652016503071591698.mp4", "seg_text": "Եթե ճիշտ արեցիր, էս իմն ա։", "seg_explanation": "Если сделал правильно, это моё.", "word": "էս", "gloss": "это", "note": "сокращение от այս [разг.]", "start": 38.559, "end": 38.719}, {"id": "w030", "video_id": "qristin77_7664194762899033352", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7664194762899033352", "src": "https://videos.armenian.cc/video_qristin77_7664194762899033352.mp4", "seg_text": "Ասեցի ջուր կուզե՞ս, ասեց, ասեց նո թենք յու, ասեցի եկե՛ք էլի, ասեցի մեր տունը բարեկամ։", "seg_explanation": "Я сказала: «Хочешь воды?», он сказал «no thank you», я сказала «приходите же», сказала, что он наш родственник.", "word": "ասեցի", "gloss": "сказала", "note": "разг. форма от ասացի [прош. вр., 1 л. ед. ч.]", "start": 16.959, "end": 17.239}, {"id": "w031", "video_id": "uxi.am_7668004175040711957", "handle": "uxi.am", "url": "https://www.tiktok.com/@uxi.am/video/7668004175040711957", "src": "https://videos.armenian.cc/video_uxi.am_7668004175040711957.mp4", "seg_text": "Լոկացիան իմանալու համար մեկնաբանությունների բաժնում գրիր «Սևան» բառը:", "seg_explanation": "Чтобы узнать локацию, напишите слово «Севан» в комментариях.", "word": "իմանալու", "gloss": "узнать", "note": "от իմանալ (знать/узнавать) [отглагольное сущ., род. п.]", "start": 39.239, "end": 39.619}, {"id": "w032", "video_id": "qristin77_7636115137736527111", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7636115137736527111", "src": "https://videos.armenian.cc/video_qristin77_7636115137736527111.mp4", "seg_text": "Վա՜յ, չիմանաս կյանքը ի՞նչ ա։", "seg_explanation": "Боже, неужели не знаешь, что такое жизнь?", "word": "չիմանաս", "gloss": "не знаешь", "note": "сослаг. накл. для риторического вопроса [разг.]", "start": 80.88, "end": 81.32}, {"id": "w033", "video_id": "dr..aghasi.sharba_7655390302001171732", "handle": "dr..aghasi.sharba", "url": "https://www.tiktok.com/@dr..aghasi.sharba/video/7655390302001171732", "src": "https://videos.armenian.cc/video_dr..aghasi.sharba_7655390302001171732.mp4", "seg_text": "Ալենջերկար պորտալ արա։", "seg_explanation": "Ален, сделай длинную пуповину.", "word": "արա։", "gloss": "сделай", "note": null, "start": 73.22, "end": 75.86}, {"id": "w034", "video_id": "lil_lil_99_7654070930196450593", "handle": "lil_lil_99", "url": "https://www.tiktok.com/@lil_lil_99/video/7654070930196450593", "src": "https://videos.armenian.cc/video_lil_lil_99_7654070930196450593.mp4", "seg_text": "Ըըը, Դանիս քնել է ժամը չորս անց կես ու ութին արթնացել, տորթ էր ուզում մամայից:", "seg_explanation": "М-м, моя Дани уснула в четыре тридцать и в восемь проснулась, хотела торт от мамы.", "word": "արթնացել,", "gloss": "проснулся", "note": "от արթնանալ (просыпаться) [причастие прош. вр.]", "start": 105.54, "end": 106.13}, {"id": "w035", "video_id": "bazhukovfamily_7650382140953152788", "handle": "bazhukovfamily", "url": "https://www.tiktok.com/@bazhukovfamily/video/7650382140953152788", "src": "https://videos.armenian.cc/video_bazhukovfamily_7650382140953152788.mp4", "seg_text": "Մեզ մոտ ամեն ինչ լավ է։", "seg_explanation": "У нас всё хорошо.", "word": "լավ", "gloss": "хорошо", "note": null, "start": 12.239, "end": 12.519}, {"id": "w036", "video_id": "avetyanskitchen_7655008179679431957", "handle": "avetyanskitchen", "url": "https://www.tiktok.com/@avetyanskitchen/video/7655008179679431957", "src": "https://videos.armenian.cc/video_avetyanskitchen_7655008179679431957.mp4", "seg_text": "Ավելացնում ենք մեկուկես թեյի գդալ աղ և հունցում ենք ձեռքերին չքպչող փափուկ խմոր, թողնում ենք քառասուն րոպե հանգստանա։", "seg_explanation": "Добавляем полторы чайные ложки соли и замешиваем мягкое тесто, не прилипающее к рукам, оставляем на сорок минут отдохнуть.", "word": "րոպե", "gloss": "минут", "note": null, "start": 29.559, "end": 29.939}, {"id": "w037", "video_id": "asatryangurgen__7656537705399979272", "handle": "asatryangurgen_", "url": "https://www.tiktok.com/@asatryangurgen_/video/7656537705399979272", "src": "https://videos.armenian.cc/video_asatryangurgen__7656537705399979272.mp4", "seg_text": "Երեխուն սիրտը գնա շահի։", "seg_explanation": "Иди расположи к себе сердце ребенка.", "word": "գնա", "gloss": "иди", "note": null, "start": 26.859, "end": 27.179}, {"id": "w038", "video_id": "chef_maykl_7662789132317445389", "handle": "chef_maykl", "url": "https://www.tiktok.com/@chef_maykl/video/7662789132317445389", "src": "https://videos.armenian.cc/video_chef_maykl_7662789132317445389.mp4", "seg_text": "Արդեն աղջիկները գալիս են ամառին, թող սարքում եմ իրանց համար։", "seg_explanation": "Девчонки уже приходят летом, пусть я приготовлю для них.", "word": "եմ", "gloss": "делаю", "note": null, "start": 23.58, "end": 23.68}, {"id": "w039", "video_id": "kamillayic_7669718750467214600", "handle": "kamillayic", "url": "https://www.tiktok.com/@kamillayic/video/7669718750467214600", "src": "https://videos.armenian.cc/video_kamillayic_7669718750467214600.mp4", "seg_text": "Լավ քաղաքացի, բան է գրում, որ մանի գոլֆ է գնում խաղալու, որ սենց գնա ավտոյից կհանես։", "seg_explanation": "Хороший гражданин, пишет что-то, что идет играть в мини-гольф, если так пойдет, выкинешь из машины.", "word": "է", "gloss": "пишет", "note": null, "start": 36.659, "end": 36.7}, {"id": "w040", "video_id": "lily_bagratuni_7631265282048281876", "handle": "lily_bagratuni", "url": "https://www.tiktok.com/@lily_bagratuni/video/7631265282048281876", "src": "https://videos.armenian.cc/video_lily_bagratuni_7631265282048281876.mp4", "seg_text": "Խմորը թողնում ենք մի կողմ հանգստանա, այդ ընթացքում պատրաստում ենք միջուկը։", "seg_explanation": "Оставляем тесто в стороне отдохнуть, а в это время готовим начинку.", "word": "մի", "gloss": "один", "note": null, "start": 32.559, "end": 32.699}, {"id": "w041", "video_id": "zhanna_jaan_7668233361306995988", "handle": "zhanna_jaan", "url": "https://www.tiktok.com/@zhanna_jaan/video/7668233361306995988", "src": "https://videos.armenian.cc/video_zhanna_jaan_7668233361306995988.mp4", "seg_text": "Նարա՛, հիմա ամենավատը այն է, որ գիշերվա մեկին եք եկել, թե կարճ են հագել, թե կարմիրը։", "seg_explanation": "Нара, сейчас самое плохое то, что вы пришли в час ночи, и что короткое надели, и что красное.", "word": "եք", "gloss": "пришли", "note": null, "start": 144.94, "end": 145.03}, {"id": "w042", "video_id": "aimusicx_01_7651850146090634503", "handle": "aimusicx_01", "url": "https://www.tiktok.com/@aimusicx_01/video/7651850146090634503", "src": "https://videos.armenian.cc/video_aimusicx_01_7651850146090634503.mp4", "seg_text": "Արա, վա՜յ, վա՜յ, վա՜յ, վա՜յ, վա՜յ, վա՜յ։", "seg_explanation": "Слушай, ой-ой-ой-ой-ой-ой.", "word": "վա՜յ։", "gloss": "ой", "note": null, "start": 23.539, "end": 23.799}, {"id": "w043", "video_id": "lily_bagratuni_7646105736002522389", "handle": "lily_bagratuni", "url": "https://www.tiktok.com/@lily_bagratuni/video/7646105736002522389", "src": "https://videos.armenian.cc/video_lily_bagratuni_7646105736002522389.mp4", "seg_text": "Պատրաստի պոնչիկները տեղավորում ենք անձեռոցիկի վրա, որպեսզի ազատվենք ավելորդ բուսայողից, թեպետ խմորը այնքան իդեալական է ստացվել, որ շատ յուղ չի ներծծում։", "seg_explanation": "Готовые пончики выкладываем на салфетку, чтобы избавиться от лишнего растительного масла, хотя тесто получилось настолько идеальным, что не впитывает много масла.", "word": "չի", "gloss": "С", "note": null, "start": 89.52, "end": 89.64}, {"id": "w044", "video_id": "arm_mation_7628982596424322336", "handle": "arm_mation", "url": "https://www.tiktok.com/@arm_mation/video/7628982596424322336", "src": "https://videos.armenian.cc/video_arm_mation_7628982596424322336.mp4", "seg_text": "Ճիշտ ես, պետք է նրան գտնենք:", "seg_explanation": "Ты прав, надо её найти.", "word": "նրան", "gloss": "его", "note": null, "start": 37.239, "end": 37.479}, {"id": "w045", "video_id": "haykmarutyanofficial_7637943792519302420", "handle": "haykmarutyanofficial", "url": "https://www.tiktok.com/@haykmarutyanofficial/video/7637943792519302420", "src": "https://videos.armenian.cc/video_haykmarutyanofficial_7637943792519302420.mp4", "seg_text": "Էդ գիտե՞ք ոնց որ ինչ լինի, ոնց որ մի զույգ փոքրիկ երեխա ունենա, դե դժվար ա երեխա պահելը, լացում ա, գիշերները չքնել, գումար ծախսել, ոչ կարողանում ես հյուր գնալ, ոչ կարողանում ես ինչ-որ քո հաճույքներով զբաղվել, աշխատանքի տեղը պրոբլեմներ, մի խոսքով՝ բարդ ա։", "seg_explanation": "Знаете, на что это похоже? Как если бы пара имела маленького ребенка, ведь трудно растить ребенка: он плачет, ночи не спишь, тратишь деньги, не можешь ни в гости пойти, ни своими удовольствиями заниматься, на работе проблемы, в общем — сложно.", "word": "ինչ", "gloss": "что", "note": null, "start": 73.18, "end": 73.3}, {"id": "w046", "video_id": "arman.sddd_7636601759598644487", "handle": "arman.sddd", "url": "https://www.tiktok.com/@arman.sddd/video/7636601759598644487", "src": "https://videos.armenian.cc/video_arman.sddd_7636601759598644487.mp4", "seg_text": "Եթե քեզ Հիսուսը պետք չէ, կարող ես անցնել այս խոսքերի կողքով, բայց եթե քեզ Հիսուսը պետք է, ասա ամեն։", "seg_explanation": "Если тебе не нужен Иисус, можешь пройти мимо этих слов, но если тебе нужен Иисус, скажи аминь.", "word": "քեզ", "gloss": "тебе", "note": null, "start": 5.159, "end": 5.339}, {"id": "w047", "video_id": "haykmarutyanofficial_7637943792519302420", "handle": "haykmarutyanofficial", "url": "https://www.tiktok.com/@haykmarutyanofficial/video/7637943792519302420", "src": "https://videos.armenian.cc/video_haykmarutyanofficial_7637943792519302420.mp4", "seg_text": "Էդ հողը ինչո՞վ ա մերը եղել, ինչո՞վ։", "seg_explanation": "А чем эта земля была нашей, чем?", "word": "Էդ", "gloss": "эта", "note": null, "start": 6.98, "end": 7.1}, {"id": "w048", "video_id": "vdrum__7652016503071591698", "handle": "vdrum_", "url": "https://www.tiktok.com/@vdrum_/video/7652016503071591698", "src": "https://videos.armenian.cc/video_vdrum__7652016503071591698.mp4", "seg_text": "A few moments later. Բա հիմա ու՞ր ենք գնում, չեմ հասկանում։", "seg_explanation": "А теперь куда мы идем, не понимаю.", "word": "ու՞ր", "gloss": "куда", "note": "", "start": 19.319, "end": 19.399}, {"id": "w049", "video_id": "tnakan_baxadratomser_7652308309948550408", "handle": "tnakan_baxadratomser", "url": "https://www.tiktok.com/@tnakan_baxadratomser/video/7652308309948550408", "src": "https://videos.armenian.cc/video_tnakan_baxadratomser_7652308309948550408.mp4", "seg_text": "Ես արդեն երկու տարի է՝ ինչ օգտագործում եմ ու շատ գոհ եմ։", "seg_explanation": "Я уже два года как использую и очень довольна.", "word": "ինչ", "gloss": "как", "note": null, "start": 138.93, "end": 138.96}, {"id": "w050", "video_id": "harutyunyans_blog_7657893609701641492", "handle": "harutyunyans_blog", "url": "https://www.tiktok.com/@harutyunyans_blog/video/7657893609701641492", "src": "https://videos.armenian.cc/video_harutyunyans_blog_7657893609701641492.mp4", "seg_text": "Այդպիսի, որ ասեմ՝ արտառոց համ չունի, բայց ես ինչ կտուր գրողին լեզուս էփավ, լեզուս էփավ, ճանկի ձագ, ճանկի ձագ, ապուշ միրգ է, հանկարծ շուտ եք։", "seg_explanation": "Такой, что не скажу, что вкус необычный, но у меня... (несвязный поток речи), глупый плод, вы поторопились.", "word": "շուտ", "gloss": "быстро", "note": null, "start": 27.619, "end": 27.819}, {"id": "w051", "video_id": "vaag_mk_7626369781670710536", "handle": "vaag_mk", "url": "https://www.tiktok.com/@vaag_mk/video/7626369781670710536", "src": "https://videos.armenian.cc/video_vaag_mk_7626369781670710536.mp4", "seg_text": "Արա, էդ ես ասում եմ՝ հնդիկ եմ, դուք էլի հնդկերեն բոցեր եք անում վրես, հեսա կզանգեմ եղբորս, կտեսնեք՝ ինչ կանի ձեզ:", "seg_explanation": "Слушайте, я же говорю, что я индуска, вы опять начинаете свои индийские приколы надо мной. Сейчас позвоню брату, увидите, что он с вами сделает.", "word": "ես", "gloss": "я говорю", "note": null, "start": 20.719, "end": 20.859}, {"id": "w052", "video_id": "qristin77_7664194762899033352", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7664194762899033352", "src": "https://videos.armenian.cc/video_qristin77_7664194762899033352.mp4", "seg_text": "Շոր եմ վերցրել արտաքի:", "seg_explanation": "Я взяла одежду для выхода.", "word": "եմ", "gloss": "взяла", "note": null, "start": 19.439, "end": 19.539}, {"id": "w053", "video_id": "ashot_hvns_7664614302359325973", "handle": "ashot_hvns", "url": "https://www.tiktok.com/@ashot_hvns/video/7664614302359325973", "src": "https://videos.armenian.cc/video_ashot_hvns_7664614302359325973.mp4", "seg_text": "Եկեք համեցեք, եկեք ինձ մի հատ կասեք ձեր սեփական տուննե՞ր են:", "seg_explanation": "Проходите, пожалуйста, скажите мне, это ваши собственные дома?", "word": "մի", "gloss": "одну", "note": null, "start": 8.039, "end": 8.139}, {"id": "w054", "video_id": "zhanna_jaan_7623822237002403093", "handle": "zhanna_jaan", "url": "https://www.tiktok.com/@zhanna_jaan/video/7623822237002403093", "src": "https://videos.armenian.cc/video_zhanna_jaan_7623822237002403093.mp4", "seg_text": "Պահպանիչ և հույս հավատացելով Քրիստոս Աստված մեր, պահի՛ր, պահպանի՛ր Հայաստան աշխարհս, քեզ հավատացող և քեզ հուսացող հայ ժողովուրդս։", "seg_explanation": "Хранитель и надежда, веруя в Христа Бога нашего, сохрани, обереги Армянскую землю и армянский народ, верящий в Тебя и уповающий на Тебя.", "word": "մեր,", "gloss": "наш", "note": null, "start": 5.34, "end": 5.51}, {"id": "w055", "video_id": "abcmedia.am_7657222046253911316", "handle": "abcmedia.am", "url": "https://www.tiktok.com/@abcmedia.am/video/7657222046253911316", "src": "https://videos.armenian.cc/video_abcmedia.am_7657222046253911316.mp4", "seg_text": "Ռուսաստանի իշխանության գնահատմամբ այս փոփոխության նպատակն է թվայնացնել միգրացիոն վերահսկողությունը։", "seg_explanation": "По оценке властей России, целью этого изменения является цифровизация миграционного контроля.", "word": "այս", "gloss": "этого", "note": null, "start": 68.959, "end": 69.119}, {"id": "w056", "video_id": "nikol.pashinyan_pm_7648692597363330311", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7648692597363330311", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7648692597363330311.mp4", "seg_text": "Լավ երեկո եմ մաղթում և սիրում եմ բոլորիդ։", "seg_explanation": "Желаю доброго вечера и люблю всех вас.", "word": "եմ", "gloss": "желаю", "note": null, "start": 5.159, "end": 5.279}, {"id": "w057", "video_id": "lily_bagratuni_7631265282048281876", "handle": "lily_bagratuni", "url": "https://www.tiktok.com/@lily_bagratuni/video/7631265282048281876", "src": "https://videos.armenian.cc/video_lily_bagratuni_7631265282048281876.mp4", "seg_text": "Առատ պանիր ենք քերում, ես այստեղ ավելացնում եմ նաև կաթնաշոր, մեկ ձու, խառնում եմ տեղը տեղին, որպեսզի բոլոր բաղադրիչները միանան իրար։", "seg_explanation": "Трем много сыра, я здесь добавляю еще творог, одно яйцо, все тщательно перемешиваю, чтобы компоненты соединились.", "word": "իրար։", "gloss": "друг с другом", "note": null, "start": 44.539, "end": 45.059}, {"id": "w058", "video_id": "haykmarutyanofficial_7637943792519302420", "handle": "haykmarutyanofficial", "url": "https://www.tiktok.com/@haykmarutyanofficial/video/7637943792519302420", "src": "https://videos.armenian.cc/video_haykmarutyanofficial_7637943792519302420.mp4", "seg_text": "Հա, բայց հինգ տարի առաջ ես այ ինչ որ մի քիչ առաջ Փաշինյանն ասեց, ես ասեի, մեկդ կհավատայի՞ք, քարերով կլարեիք իրեն, չէ՞, ո-ո՞վ էլ ասեր, բայց հիմա արդեն նորմալ ա ընդունվում։", "seg_explanation": "Да, но пять лет назад, если бы я сказал то, что только что сказал Пашинян, вы бы поверили? Вы бы забросали его камнями, не так ли? Кто бы ни сказал, но сейчас это уже нормально воспринимается.", "word": "այ", "gloss": "ай", "note": null, "start": 150.4, "end": 150.6}, {"id": "w059", "video_id": "lil_lil_99_7654070930196450593", "handle": "lil_lil_99", "url": "https://www.tiktok.com/@lil_lil_99/video/7654070930196450593", "src": "https://videos.armenian.cc/video_lil_lil_99_7654070930196450593.mp4", "seg_text": "Ջա՛ն, դե արի գրկեմ:", "seg_explanation": "Родная, ну иди обниму.", "word": "դե", "gloss": "ну", "note": null, "start": 20.02, "end": 20.16}, {"id": "w060", "video_id": "haykmarutyanofficial_7629414537296579860", "handle": "haykmarutyanofficial", "url": "https://www.tiktok.com/@haykmarutyanofficial/video/7629414537296579860", "src": "https://videos.armenian.cc/video_haykmarutyanofficial_7629414537296579860.mp4", "seg_text": "Զարդերով զարդերով կրկնեմ ու գնամ քեր ու։", "seg_explanation": "С украшениями, с украшениями повторю и пойду...", "word": "քեր", "gloss": "тер", "note": null, "start": 14.579, "end": 14.859}, {"id": "w061", "video_id": "harutyunyans_blog_7666758253413469460", "handle": "harutyunyans_blog", "url": "https://www.tiktok.com/@harutyunyans_blog/video/7666758253413469460", "src": "https://videos.armenian.cc/video_harutyunyans_blog_7666758253413469460.mp4", "seg_text": "Հա, ու մեկ էլ չես մեռնի, պատպիսկա տու։", "seg_explanation": "Да, и ещё, ты не умрешь, подпишись.", "word": "տու։", "gloss": "дай", "note": null, "start": 33.059, "end": 33.299}, {"id": "w062", "video_id": "nayeqaxchiknerjan_7665802440767294728", "handle": "nayeqaxchiknerjan", "url": "https://www.tiktok.com/@nayeqaxchiknerjan/video/7665802440767294728", "src": "https://videos.armenian.cc/video_nayeqaxchiknerjan_7665802440767294728.mp4", "seg_text": "Էս ավարտին արևը և պիասի շողերը, թե չէ կասկած, չի երևի քեզ մեջն ի անձրևում կամ լի։", "seg_explanation": "В этом финале солнце и лучи песни, если нет сомнений, не видны в тебе ни в дожде, ни в чем-либо еще.", "word": "պիասի", "gloss": "маленький", "note": null, "start": 79.48, "end": 80.14}, {"id": "w063", "video_id": "nayeqaxchiknerjan_7665802440767294728", "handle": "nayeqaxchiknerjan", "url": "https://www.tiktok.com/@nayeqaxchiknerjan/video/7665802440767294728", "src": "https://videos.armenian.cc/video_nayeqaxchiknerjan_7665802440767294728.mp4", "seg_text": "Սեր, սեր, սեր անչե՛ր, գիշերվա նոր սեր։", "seg_explanation": "Любовь, любовь, любовь без конца, новая ночная любовь.", "word": "նոր", "gloss": "новый", "note": null, "start": 128.38, "end": 128.829}, {"id": "w064", "video_id": "www.ishkhanutyun.am_7637965868802051346", "handle": "www.ishkhanutyun.am", "url": "https://www.tiktok.com/@www.ishkhanutyun.am/video/7637965868802051346", "src": "https://videos.armenian.cc/video_www.ishkhanutyun.am_7637965868802051346.mp4", "seg_text": "Եվ այդ բոլոր մարդիկ համախումբն են, որ պիտի հասան իրա պատշգամբը՝ Ապագայուս և սանիտառապետության համար կացի։", "seg_explanation": "И все эти люди — группа, которая должна была достичь его балкона, ради Будущего и санитарной безопасности.", "word": "են,", "gloss": "являются собранием", "note": null, "start": 70.439, "end": 70.679}, {"id": "w065", "video_id": "nushohanian_7644323178126380321", "handle": "nushohanian", "url": "https://www.tiktok.com/@nushohanian/video/7644323178126380321", "src": "https://videos.armenian.cc/video_nushohanian_7644323178126380321.mp4", "seg_text": "Կնամ սատկնեմ, կնամ բռնցքներս բռնեմ, եթե իրան թակեմ։", "seg_explanation": "Лучше умру, лучше буду сжимать кулаки, если его ударю.", "word": "բռնցքներս", "gloss": "кулаки", "note": null, "start": 52.86, "end": 54.259}, {"id": "w066", "video_id": "foreverrr___3_7666927979880025364", "handle": "foreverrr___3", "url": "https://www.tiktok.com/@foreverrr___3/video/7666927979880025364", "src": "https://videos.armenian.cc/video_foreverrr___3_7666927979880025364.mp4", "seg_text": "Դու իրան չէիր ասել, որ ես քեզ հավատի օգնում էի դասերի հարցում:", "seg_explanation": "Ты не сказал(а) ему/ей, что я помогал(а) тебе с уроками.", "word": "օգնում", "gloss": "помогал", "note": null, "start": 24.26, "end": 24.519}, {"id": "w067", "video_id": "zhanna_jaan_7647020929880460564", "handle": "zhanna_jaan", "url": "https://www.tiktok.com/@zhanna_jaan/video/7647020929880460564", "src": "https://videos.armenian.cc/video_zhanna_jaan_7647020929880460564.mp4", "seg_text": "Չպպզի թռնենք բռովս։", "seg_explanation": "Давай сбежим, чтобы не прилипло.", "word": "թռնենք", "gloss": "полетим", "note": null, "start": 31.17, "end": 31.55}, {"id": "w068", "video_id": "oravarc.am_7659812444029635848", "handle": "oravarc.am", "url": "https://www.tiktok.com/@oravarc.am/video/7659812444029635848", "src": "https://videos.armenian.cc/video_oravarc.am_7659812444029635848.mp4", "seg_text": "Այս հանգստի գոտին ստեղծված է, որ դուք պարզապես վայելեք օրը, իսկ գեղեցիկ հիշողությունները հետը տանեք ձեր տանը:", "seg_explanation": "Эта зона отдыха создана для того, чтобы вы просто насладились днем, а прекрасные воспоминания унесли с собой домой.", "word": "հետը", "gloss": "с собой", "note": null, "start": 37.02, "end": 37.139}, {"id": "w069", "video_id": "nushohanian_7644323178126380321", "handle": "nushohanian", "url": "https://www.tiktok.com/@nushohanian/video/7644323178126380321", "src": "https://videos.armenian.cc/video_nushohanian_7644323178126380321.mp4", "seg_text": "Կամաց են սրսկելու, կամաց են, ես մեկ է չեմ վախենալու։", "seg_explanation": "Будут колоть нежно, нежно, я все равно не буду бояться.", "word": "են", "gloss": "тихо", "note": null, "start": 26.18, "end": 26.259}, {"id": "w070", "video_id": "haykmarutyanofficial_7629414537296579860", "handle": "haykmarutyanofficial", "url": "https://www.tiktok.com/@haykmarutyanofficial/video/7629414537296579860", "src": "https://videos.armenian.cc/video_haykmarutyanofficial_7629414537296579860.mp4", "seg_text": "Կապույտ կապույտ էր քո աչքերը։", "seg_explanation": "Твои глаза были синими-синими.", "word": "էր", "gloss": "были", "note": "вспом. гл. в 3 л. ед. ч. (здесь грамматически не согласуется с мн. ч. աչքերը, что часто встречается в разговорной речи) [прош. вр.]", "start": 4.759, "end": 5.019}, {"id": "w071", "video_id": "zhanna_jaan_7655423811830992149", "handle": "zhanna_jaan", "url": "https://www.tiktok.com/@zhanna_jaan/video/7655423811830992149", "src": "https://videos.armenian.cc/video_zhanna_jaan_7655423811830992149.mp4", "seg_text": "Հեյ նորմալ մերը նորմալ քուրը հիսուն հիսուն ո՞ւմ է քաշել։", "seg_explanation": "Эй, нормальная мать, нормальная сестра, кого они по пятьдесят-пятьдесят обманули?", "word": "քուրը", "gloss": "сестра", "note": null, "start": 22.299, "end": 22.599}, {"id": "w072", "video_id": "bazhukovfamily_7589507531844717844", "handle": "bazhukovfamily", "url": "https://www.tiktok.com/@bazhukovfamily/video/7589507531844717844", "src": "https://videos.armenian.cc/video_bazhukovfamily_7589507531844717844.mp4", "seg_text": "Եվ սոցիալական ցանցերում մեզ շարժվիր ընդունես։", "seg_explanation": "И в социальных сетях, пожалуйста, примите нас.", "word": "շարժվիր", "gloss": "двигайся", "note": "вероятно, ошибка автора, скорее всего имелось в виду խնդրում եմ (пожалуйста)", "start": 8.019, "end": 8.479}, {"id": "w073", "video_id": "ashot_hvns_7631958585274158356", "handle": "ashot_hvns", "url": "https://www.tiktok.com/@ashot_hvns/video/7631958585274158356", "src": "https://videos.armenian.cc/video_ashot_hvns_7631958585274158356.mp4", "seg_text": "Էս ինչ առաջին անգամ եմ տեսնում խաղալիք է երեխու համար։", "seg_explanation": "Что это за игрушка, которую я впервые вижу, для ребенка?", "word": "է", "gloss": "это", "note": null, "start": 35.939, "end": 35.959}, {"id": "w074", "video_id": "edo.beglaryan41_7654665318870060305", "handle": "edo.beglaryan41", "url": "https://www.tiktok.com/@edo.beglaryan41/video/7654665318870060305", "src": "https://videos.armenian.cc/video_edo.beglaryan41_7654665318870060305.mp4", "seg_text": "Մայրական ածունքները հոգուս մի մեծ վերք են ամեն, հայրիքի զանից էլ ու կյանքս տալու մաս չէ գեղեն:", "seg_explanation": "Материнские наставления — это глубокая рана в моей душе, из-за зова родины и части того, чтобы отдать свою жизнь, нет покоя.", "word": "էլ", "gloss": "также", "note": null, "start": 8.42, "end": 8.559}, {"id": "w075", "video_id": "nikol.pashinyan_pm_7623998996230507783", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7623998996230507783", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7623998996230507783.mp4", "seg_text": "Էս սենց նում էլ մի գեղա, մի գեղա, գեղա, գեղա, գեղա, իմ գրկում մնա, իմ գրկում մնա, մնա", "seg_explanation": "Эта вот такая... оставайся, оставайся, оставайся, оставайся, оставайся, оставайся в моих объятиях, оставайся в моих объятиях, оставайся.", "word": "մի", "gloss": "один", "note": null, "start": 1.579, "end": 1.759}, {"id": "w076", "video_id": "novax3160_7666173171308989728", "handle": "novax3160", "url": "https://www.tiktok.com/@novax3160/video/7666173171308989728", "src": "https://videos.armenian.cc/video_novax3160_7666173171308989728.mp4", "seg_text": "Չենք ուզում մատ լու լսենք, թե Սարգիս տղաս վիրավորվել է կամ ձեռքը ջախկել ա։", "seg_explanation": "Не хотим слышать (слухи), что мой сын Саркис ранен или у него рука сломана.", "word": "ջախկել", "gloss": "сломал.", "note": null, "start": 79.38, "end": 79.88}, {"id": "w077", "video_id": "ashot_hvns_7618604024119577877", "handle": "ashot_hvns", "url": "https://www.tiktok.com/@ashot_hvns/video/7618604024119577877", "src": "https://videos.armenian.cc/video_ashot_hvns_7618604024119577877.mp4", "seg_text": "Լսի՛ այն բանը էլի պատմի այն ձյայցը, որ եկել էր Լիլիթին չէր տեսել, պառկած նստել էր բերնի։", "seg_explanation": "Послушай, расскажи ту историю про того мужика, который пришел, Лилит не увидел и остался сидеть с открытым ртом (на пороге).", "word": "ձյայցը,", "gloss": "парня", "note": null, "start": 82.059, "end": 82.459}, {"id": "w078", "video_id": "qristin77_7636115137736527111", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7636115137736527111", "src": "https://videos.armenian.cc/video_qristin77_7636115137736527111.mp4", "seg_text": "Ինչի՞ ես չասում, բա խի՞ չես բերես ստեղ։", "seg_explanation": "Почему не говоришь, а почему не принесешь сюда?", "word": "բա", "gloss": "ну", "note": null, "start": 61.46, "end": 61.48}, {"id": "w079", "video_id": "qristin77_7664194762899033352", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7664194762899033352", "src": "https://videos.armenian.cc/video_qristin77_7664194762899033352.mp4", "seg_text": "Մամ, դե ման ցիգը մամոտ ա:", "seg_explanation": "Мам, ну [это] близко.", "word": "ցիգը", "gloss": "цыгане", "note": null, "start": 53.319, "end": 53.619}, {"id": "w080", "video_id": "sayatharutyunyan_7656467840593186069", "handle": "sayatharutyunyan", "url": "https://www.tiktok.com/@sayatharutyunyan/video/7656467840593186069", "src": "https://videos.armenian.cc/video_sayatharutyunyan_7656467840593186069.mp4", "seg_text": "Մեր տան սուպերհերոսը էտի տատիկն է, էն խարչոր չեմ կրնամ լուծեմ, լուծենքը ինքը, տատիկի ձեմը խախչ կա մեր տան մեջ սին է, իմ սաղ խարչերի բալնիկ է, իրա ձեռին է, կախմեքեմ քո ձի, ու իմ խաթրիս կբնիմ եր հայաթի, չալոյի ու ջեքոյի օրինքն է, դաժե պապան ու մաման հեռու կմնան ընկիս, երբ որ իմ կողքին իմ սուպերհերոս տատին, ես պրոբլեմ չունիմ իմ կողքինեմ տատին, նոր որ ընդ գիտար սաժե տատին ծեփե գըթ պատին, ես պրոբլեմ չունիմ իմ կողքինեմ տատին, նոր որ ընդ գիտար սաժե տատին ծեփե գըթ պատին", "seg_explanation": "Супергерой нашего дома — это бабушка. Те задачи, которые я не могу решить, решает она. Бабушка — единственная, кого боятся в нашем доме. Она отвечает за все мои дела. Даже папа и мама держатся от меня подальше, когда рядом моя бабушка-супергерой. У меня нет проблем, когда рядом бабушка.", "word": "գըթ", "gloss": "прямо", "note": null, "start": 37.979, "end": 38.159}, {"id": "w081", "video_id": "vdrum__7652016503071591698", "handle": "vdrum_", "url": "https://www.tiktok.com/@vdrum_/video/7652016503071591698", "src": "https://videos.armenian.cc/video_vdrum__7652016503071591698.mp4", "seg_text": "Ինչը, երբ կսկսեմ, որ հաստատ կգրեք։", "seg_explanation": "Что и когда я начну — точно запишете.", "word": "Ինչը,", "gloss": "что", "note": null, "start": 20.959, "end": 22.02}, {"id": "w082", "video_id": "marik_gevorgian_7660927737812536584", "handle": "marik_gevorgian", "url": "https://www.tiktok.com/@marik_gevorgian/video/7660927737812536584", "src": "https://videos.armenian.cc/video_marik_gevorgian_7660927737812536584.mp4", "seg_text": "Մեկն ասի. «ով ես դու, չտես ու անդուռ»։", "seg_explanation": "Пусть кто-то скажет: «Кто ты такая, выскочка и невоспитанная».", "word": "«ով", "gloss": "кто", "note": null, "start": 30.18, "end": 30.36}, {"id": "w083", "video_id": "dr..aghasi.sharba_7655390302001171732", "handle": "dr..aghasi.sharba", "url": "https://www.tiktok.com/@dr..aghasi.sharba/video/7655390302001171732", "src": "https://videos.armenian.cc/video_dr..aghasi.sharba_7655390302001171732.mp4", "seg_text": "Տասը ժամ է, շատ է։", "seg_explanation": "Десять часов, это много.", "word": "է,", "gloss": "это много", "note": null, "start": 118.54, "end": 118.94}, {"id": "w084", "video_id": "zhanna_jaan_7655423811830992149", "handle": "zhanna_jaan", "url": "https://www.tiktok.com/@zhanna_jaan/video/7655423811830992149", "src": "https://videos.armenian.cc/video_zhanna_jaan_7655423811830992149.mp4", "seg_text": "Հեյ նորմալ մերը նորմալ քուրը հիսուն հիսուն ո՞ւմ է քաշել։", "seg_explanation": "Эй, нормальная мать, нормальная сестра, кого они по пятьдесят-пятьдесят обманули?", "word": "Հեյ", "gloss": "эй", "note": null, "start": 20.52, "end": 20.779}, {"id": "w085", "video_id": "vaag_mk_7626369781670710536", "handle": "vaag_mk", "url": "https://www.tiktok.com/@vaag_mk/video/7626369781670710536", "src": "https://videos.armenian.cc/video_vaag_mk_7626369781670710536.mp4", "seg_text": "Էռնա՛, ես քեզ հետա կզանգեմ:", "seg_explanation": "Эрна, я тебе перезвоню.", "word": "հետա", "gloss": "позвоню позже", "note": null, "start": 33.84, "end": 33.88}, {"id": "w086", "video_id": "victorypark.yerevan_7666739123402591509", "handle": "victorypark.yerevan", "url": "https://www.tiktok.com/@victorypark.yerevan/video/7666739123402591509", "src": "https://videos.armenian.cc/video_victorypark.yerevan_7666739123402591509.mp4", "seg_text": "Ամբողջ ծառ ատրակցիոնների օր հատուկ ձեզ համար։", "seg_explanation": "Целый день аттракционов специально для вас.", "word": "ծառ", "gloss": "дерево", "note": null, "start": 1.019, "end": 1.139}, {"id": "w087", "video_id": "qristin77_7666840740512763154", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7666840740512763154", "src": "https://videos.armenian.cc/video_qristin77_7666840740512763154.mp4", "seg_text": "Ջանդամ չեն ծեծում, ոտերս չի, չոքերս չի, ամբողջը վերևը չքսեցիր, բերի սրան կնեի", "seg_explanation": "К черту стучат, это не ноги мои, не колени мои, ты все сверху не намазала, принеси это сделаю", "word": "Ջանդամ", "gloss": "черт с ним", "note": "заимствование [разг.]", "start": 51.739, "end": 52.139}, {"id": "w088", "video_id": "ashot_hvns_7664614302359325973", "handle": "ashot_hvns", "url": "https://www.tiktok.com/@ashot_hvns/video/7664614302359325973", "src": "https://videos.armenian.cc/video_ashot_hvns_7664614302359325973.mp4", "seg_text": "Դե հա, կներեք, Տիգրան ջան, բայց դե հիմա ինչ, ինձ ձեռքերը, ապաշխարհ կտայի, ցավդ տանեմ, խնդրեմ:", "seg_explanation": "Ну да, извините, Тигран джан, но что теперь поделать, я бы руками и ногами помогла бы, возьму твою боль, пожалуйста.", "word": "ձեռքերը,", "gloss": "руки", "note": null, "start": 39.54, "end": 39.939}, {"id": "w089", "video_id": "esinchakataka_7641626266600246536", "handle": "esinchakataka", "url": "https://www.tiktok.com/@esinchakataka/video/7641626266600246536", "src": "https://videos.armenian.cc/video_esinchakataka_7641626266600246536.mp4", "seg_text": "Տամար, ու՞ր ես այ կեղտոտ։", "seg_explanation": "Тамар, где ты, грязнуля?", "word": "այ", "gloss": "эй", "note": "междометие, обращение для привлечения внимания [разг.]", "start": 5.579, "end": 5.719}, {"id": "w090", "video_id": "asatryangurgen__7643116752305507591", "handle": "asatryangurgen_", "url": "https://www.tiktok.com/@asatryangurgen_/video/7643116752305507591", "src": "https://videos.armenian.cc/video_asatryangurgen__7643116752305507591.mp4", "seg_text": "Չունի, է, ինչ անի։", "seg_explanation": "У него нет, ну что поделать.", "word": "Չունի,", "gloss": "нет у него", "note": null, "start": 66.319, "end": 66.419}, {"id": "w091", "video_id": "bazhukovfamily_7540727140082273554", "handle": "bazhukovfamily", "url": "https://www.tiktok.com/@bazhukovfamily/video/7540727140082273554", "src": "https://videos.armenian.cc/video_bazhukovfamily_7540727140082273554.mp4", "seg_text": "Ես Հայրիկ Հյուրան եմ, լուսանկարիչ, վիդեոգրաֆ, մարտական ցուլասեն կարչյուտունեմ սովորեցնում։", "seg_explanation": "Я Айрик Хюрян, фотограф, видеограф, обучаю боевым искусствам.", "word": "կարչյուտունեմ", "gloss": "обучаю", "note": null, "start": 28.859, "end": 29.519}, {"id": "w092", "video_id": "ashot_hvns_7618604024119577877", "handle": "ashot_hvns", "url": "https://www.tiktok.com/@ashot_hvns/video/7618604024119577877", "src": "https://videos.armenian.cc/video_ashot_hvns_7618604024119577877.mp4", "seg_text": "Գալիս փորով ձյածկեքը նստում են քամակները վրեն։", "seg_explanation": "Приходят, своими пузатыми задницами садятся на них.", "word": "ձյածկեքը", "gloss": "дядьки", "note": null, "start": 35.939, "end": 36.599}, {"id": "w093", "video_id": "zhanna_jaan_7668233361306995988", "handle": "zhanna_jaan", "url": "https://www.tiktok.com/@zhanna_jaan/video/7668233361306995988", "src": "https://videos.armenian.cc/video_zhanna_jaan_7668233361306995988.mp4", "seg_text": "Սամվելը դու երեսուն երեք տարեկան ամոթ է, ինչ ամոթ է։", "seg_explanation": "Самвел, тебе тридцать три года, стыдно, как стыдно.", "word": "երեք", "gloss": "три", "note": null, "start": 36.28, "end": 36.52}, {"id": "w094", "video_id": "edo.beglaryan41_7654665318870060305", "handle": "edo.beglaryan41", "url": "https://www.tiktok.com/@edo.beglaryan41/video/7654665318870060305", "src": "https://videos.armenian.cc/video_edo.beglaryan41_7654665318870060305.mp4", "seg_text": "Աչքս չափի թերավոր մումեն եմ վանել ամեն օր, մի նացիր անուշ մայրիկ, ախ Հայաստուն կգա մի օր:", "seg_explanation": "Каждый день я прогонял свои глаза, полные меры недостатка, не плачь, милая мама, ах, Армения придет однажды.", "word": "մումեն", "gloss": "свечой", "note": null, "start": 15.019, "end": 15.819}, {"id": "w095", "video_id": "fasdusha_7649710075057098002", "handle": "fasdusha", "url": "https://www.tiktok.com/@fasdusha/video/7649710075057098002", "src": "https://videos.armenian.cc/video_fasdusha_7649710075057098002.mp4", "seg_text": "Մտնում ես Samsung-ի զավադսկոյ բրաուզերի մեջ, սեղմում ես ներքևի աջ անկյունում երեք հատ կետիկը, սեղմում ես բլակիրովշիկ էկրանը և քաշում ես AdBlock ծրագիրը։", "seg_explanation": "Заходишь в заводской браузер Samsung, нажимаешь на три точки в нижнем правом углу, нажимаешь «блокировщик содержимого» и скачиваешь программу AdBlock.", "word": "AdBlock", "gloss": "AdBlock", "note": null, "start": 12.699, "end": 13.38}, {"id": "w096", "video_id": "aibyed_7646884351459872020", "handle": "aibyed", "url": "https://www.tiktok.com/@aibyed/video/7646884351459872020", "src": "https://videos.armenian.cc/video_aibyed_7646884351459872020.mp4", "seg_text": "/sources:", "seg_explanation": "/sources:", "word": "/sources:", "gloss": "/sources:", "note": null, "start": 2.079, "end": 2.98}, {"id": "w097", "video_id": "bazhukovfamily_7650382140953152788", "handle": "bazhukovfamily", "url": "https://www.tiktok.com/@bazhukovfamily/video/7650382140953152788", "src": "https://videos.armenian.cc/video_bazhukovfamily_7650382140953152788.mp4", "seg_text": "Стол՝ սեղան, стул՝ աթոռ, окно՝ պատուհան, компьютер՝ համակարգիչ, телевизор՝ հեռուստացույց, диван, я не знаю что բազմոց, кровать, кроват, кроватЪ, մահճակալ, пол՝ հատակ, стена՝ պատ, потолок՝ առաստաղ, булка!", "seg_explanation": "Стол — սեղան, стул — աթոռ, окно — պատուհան, компьютер — համակարգիչ, телевизор — հեռուստացույց, диван… я не знаю что… — բազմոց, кровать — кроват, кроватЪ, մահճակալ, пол — հատակ, стена — պատ, потолок — առաստաղ, булка!", "word": "знаю", "gloss": "знаю", "note": null, "s ": "Բա աֆրո գացը պուտեր լիմոնոտ, bro, bro շոդամ, bro:", "seg_explanation": "А вот афро... лимон, бро, бро, сделаю, бро.", "word": "bro:", "gloss": "бро", "note": null, "start": 89.21, "end": 89.48}, {"id": "w104", "video_id": "narek.7071_7646446372966845714", "handle": "narek.7071", "url": "https://www.tiktok.com/@narek.7071/video/7646446372966845714", "src": "https://videos.armenian.cc/video_narek.7071_7646446372966845714.mp4", "seg_text": "Թեկնածուն եմ number one from Իջևան։", "seg_explanation": "Я кандидат номер один из Иджевана.", "word": "one", "gloss": "один", "note": null, "start": 10.619, "end": 10.739}, {"id": "w105", "video_id": "evelinakhanoyan_7670229790628072724", "handle": "evelinakhanoyan", "url": "https://www.tiktok.com/@evelinakhanoyan/video/7670229790628072724", "src": "https://videos.armenian.cc/video_evelinakhanoyan_7670229790628072724.mp4", "seg_text": "Don't touch me!", "seg_explanation": "Не трогай меня!", "word": "me!", "gloss": "меня", "note": null, "start": 16.84, "end": 17.02}, {"id": "w106", "video_id": "antheryyyyyy_7662107041934183700", "handle": "antheryyyyyy", "url": "https://www.tiktok.com/@antheryyyyyy/video/7662107041934183700", "src": "https://videos.armenian.cc/video_antheryyyyyy_7662107041934183700.mp4", "seg_text": "Դեղինը, ըըը, знаете, я считаю, это такой лучезарный, солнечный цвет, который определяет жизнерадостность, общительность", "seg_explanation": "Желтый, э-э-э, знаете, я считаю, это такой лучезарный, солнечный цвет, который определяет жизнерадостность, общительность.", "word": "я", "gloss": "я", "note": null, "start": 48.319, "end": 48.34}, {"id": "w107", "video_id": "arg_104_7660985936175435016", "handle": "arg_104", "url": "https://www.tiktok.com/@arg_104/video/7660985936175435016", "src": "https://videos.armenian.cc/video_arg_104_7660985936175435016.mp4", "seg_text": "С одной головы вся седина, весь пух и прах, всё с одного ребра и одна сатана, а в глаза бела пелена, да со рта пена бела брызжет, кипит буйна голова да моя, я могу черта два на три. I know that you love me. You don't need to remind me. Put it all behind me. But baby, I see her in the back of my mind all the time. Feels like a fever. Like I'm burning alive like a sign", "seg_explanation": "Данный текст не содержит армянских предложений для анализа.", "word": "голова", "gloss": "голова", "note": null, "start": 70.0, "end": 70.54}, {"id": "w108", "video_id": "ovs3_7640474938171755797", "handle": "ovs3", "url": "https://www.tiktok.com/@ovs3/video/7640474938171755797", "src": "https://videos.armenian.cc/video_ovs3_7640474938171755797.mp4", "seg_text": "Նվիրում եմ երեք Beauty Box-ի աղջկական ամենահավես նվերներով և զարթ պրեկո մեշից:", "seg_explanation": "Разыгрываю три Beauty Box с самыми крутыми девчачьими подарками и украшениями из «Прейко Меш».", "word": "Box-ի", "gloss": "коробки", "note": null, "start": 1.199, "end": 1.559}, {"id": "w109", "video_id": "narek.7071_7646446372966845714", "handle": "narek.7071", "url": "https://www.tiktok.com/@narek.7071/video/7646446372966845714", "src": "https://videos.armenian.cc/video_narek.7071_7646446372966845714.mp4", "seg_text": "Я в России для них как братан։", "seg_explanation": "Я в России для них как братан.", "word": "них", "gloss": "них", "note": null, "start": 22.379, "end": 22.68}, {"id": "w110", "video_id": "armenia_24_7657454144982174994", "handle": "armenia_24", "url": "https://www.tiktok.com/@armenia_24/video/7657454144982174994", "src": "https://videos.armenian.cc/video_armenia_24_7657454144982174994.mp4", "seg_text": "2026 թվականի հուլիսի 1-ից ուժի մեջ են մտնում մի շարք կարևոր ծրագրեր և օրենսդրական փոփոխություններ, որոնք ազդեցություն կունենան ինչպես քաղաքացիների, այնպես էլ բիզնեսի գործունեության վրա:", "seg_explanation": "С 1 июля 2026 года вступают в силу ряд важных программ и законодательных изменений, которые окажутся значимыми как для граждан, так и для деятельности бизнеса.", "word": "2026", "gloss": "2026", "note": null, "start": 0.18, "end": 1.18}, {"id": "w111", "video_id": "evelinakhanoyan_7670229790628072724", "handle": "evelinakhanoyan", "url": "https://www.tiktok.com/@evelinakhanoyan/video/7670229790628072724", "src": "https://videos.armenian.cc/video_evelinakhanoyan_7670229790628072724.mp4", "seg_text": "Այսինքն, օրինակ, որ իրանց ասես․ «Վայ, կյանքս, կարա՞ս մի քիչ հեռու նստես, նեղվում եմ, որ շատ մոտիկ ես նստած», իրանք կարող ա քեզնից նեղանան, հետո տասը տարի չխոսան, ոչ մի feedback իրանց չես կարողանում տաս։", "seg_explanation": "То есть, например, если ты им скажешь: «Ой, дорогая(ой), можешь сесть немного подальше, мне неловко, что ты сидишь слишком близко», они могут на тебя обидеться, потом десять лет не разговаривать, никакой feedback им не можешь дать.", "word": "feedback", "gloss": "обратную связь", "note": null, "start": 58.299, "end": 58.599}, {"id": "w112", "video_id": "evelinakhanoyan_7670229790628072724", "handle": "evelinakhanoyan", "url": "https://www.tiktok.com/@evelinakhanoyan/video/7670229790628072724", "src": "https://videos.armenian.cc/video_evelinakhanoyan_7670229790628072724.mp4", "seg_text": "Red flag-եր մարդկանց մեջ, որոնց առկայությունը ինձ կխանգարի ձեր հետ շատ մոտիկ լինելը։", "seg_explanation": "Тревожные звоночки в людях, присутствие которых помешает мне быть с вами в очень близких отношениях.", "word": "Red", "gloss": "красные флаги", "note": null, "start": 0.319, "end": 0.5}, {"id": "w113", "video_id": "shadowride3_7662663697118039317", "handle": "shadowride3", "url": "https://www.tiktok.com/@shadowride3/video/7662663697118039317", "src": "https://videos.armenian.cc/video_shadowride3_7662663697118039317.mp4", "seg_text": "Լավ ա, լավ ա, ախպերս, հանց էլ ա, մեջից քո կարևոր վեշերը վեր կառու, ավտոյից բանալիները տուր, անունը փոխության համար էլ կզանգեմ, ինձ Instagram-ով կգրես։", "seg_explanation": "Ладно, ладно, брат мой, раз так, забери свои важные вещи, отдай ключи от машины, по поводу переоформления я позвоню, напишешь мне в Instagram.", "word": "Instagram-ով", "gloss": "через Instagram", "note": null, "start": 145.4, "end": 145.9}, {"id": "w114", "video_id": "bazhukovfamily_7650382140953152788", "handle": "bazhukovfamily", "url": "https://www.tiktok.com/@bazhukovfamily/video/7650382140953152788", "src": "https://videos.armenian.cc/video_bazhukovfamily_7650382140953152788.mp4", "seg_text": "Сегодня будем учить слова на армянском языке, армянский с Алиной урок четырнадцать, Հայոց լեզու Ալինայի հետ դաս տասնչորս։", "seg_explanation": "Сегодня будем учить слова на армянском языке, армянский с Алиной урок четырнадцать, армянский язык с Алиной, урок четырнадцать.", "word": "урок", "gloss": "урок", "note": null, "start": 17.279, "end": 17.479}, {"id": "w115", "video_id": "plotmood6677_7658920455968918805", "handle": "plotmood6677", "url": "https://www.tiktok.com/@plotmood6677/video/7658920455968918805", "src": "https://videos.armenian.cc/video_plotmood6677_7658920455968918805.mp4", "seg_text": "Շուրջը բոլորը սուտ, բայց մերը իրական ա։", "seg_explanation": "Вокруг всё ложь, но наше — настоящее.", "word": "սուտ,", "gloss": "ложь", "note": null, "start": 10.779, "end": 11.039}, {"id": "w116", "video_id": "tnakan_baxadratomser_7652308309948550408", "handle": "tnakan_baxadratomser", "url": "https://www.tiktok.com/@tnakan_baxadratomser/video/7652308309948550408", "src": "https://videos.armenian.cc/video_tnakan_baxadratomser_7652308309948550408.mp4", "seg_text": "Խառնում ենք, ստացված զանգվածը լցնում ալյուրի մեջ ու հունցում խմոր։", "seg_explanation": "Перемешиваем, полученную массу выливаем в муку и замешиваем тесто.", "word": "ալյուրի", "gloss": "в муку", "note": null, "start": 31.48, "end": 31.72}, {"id": "w117", "video_id": "divergent_7_7635640908070866183", "handle": "divergent_7", "url": "https://www.tiktok.com/@divergent_7/video/7635640908070866183", "src": "https://videos.armenian.cc/video_divergent_7_7635640908070866183.mp4", "seg_text": "Երբ որ Աստված չի պատասխանում, դու մի մտածիր, որ Աստված քեզ չի տեսնում, որ Աստված չի ուզում, որ դու շարժվես, որ քո համար հրաշք Աստված չի պատրաստել:", "seg_explanation": "Когда Бог не отвечает, не думай, что Бог тебя не видит, что Бог не хочет, чтобы ты двигался, что Бог не приготовил для тебя чудо.", "word": "պատասխանում,", "gloss": "не отвечает", "note": null, "start": 1.799, "end": 2.379}, {"id": "w118", "video_id": "gorrkarapetyan_7665759107466464532", "handle": "gorrkarapetyan", "url": "https://www.tiktok.com/@gorrkarapetyan/video/7665759107466464532", "src": "https://videos.armenian.cc/video_gorrkarapetyan_7665759107466464532.mp4", "seg_text": "Ուտենք, խմենք, լավ քեֆ անենք էս գիշեր, որ այսօրից մեզ մնա միշտ լավ հուշեր։", "seg_explanation": "Давайте поедим, выпьем, хорошо повеселимся этой ночью, чтобы от сегодняшнего дня у нас всегда оставались хорошие воспоминания.", "word": "խմենք,", "gloss": "попьем", "note": "от խմել (пить) [повел. накл., 1 л. мн. ч.]", "start": 22.939, "end": 23.279}, {"id": "w119", "video_id": "bazhukovfamily_7664467996794014996", "handle": "bazhukovfamily", "url": "https://www.tiktok.com/@bazhukovfamily/video/7664467996794014996", "src": "https://videos.armenian.cc/video_bazhukovfamily_7664467996794014996.mp4", "seg_text": "Տեղեկությունը կգտնեք պրոֆիլի խղումով նոր հեռախոս բաժնում:", "seg_explanation": "Информацию вы найдете по ссылке в профиле в разделе «новый телефон».", "word": "բաժնում:", "gloss": "в разделе", "note": null, "start": 70.819, "end": 71.26}, {"id": "w120", "video_id": "simpo.....samo_7629307328130501904", "handle": "simpo.....samo", "url": "https://www.tiktok.com/@simpo.....samo/video/7629307328130501904", "src": "https://videos.armenian.cc/video_simpo.....samo_7629307328130501904.mp4", "seg_text": "Տարանջանջանված ենք, պատվերները շատ-շատ է, դրա համար ուշացում եղավ։", "seg_explanation": "Мы перегружены, заказов очень много, поэтому произошла задержка.", "word": "է,", "gloss": "есть", "note": null, "start": 34.159, "end": 34.2}, {"id": "w121", "video_id": "padilayca.areq_7657560740953509127", "handle": "padilayca.areq", "url": "https://www.tiktok.com/@padilayca.areq/video/7657560740953509127", "src": "https://videos.armenian.cc/video_padilayca.areq_7657560740953509127.mp4", "seg_text": "Քույր իմ անգին ու թանկագին, դու ես իմ վստահելին, քեզ համար կյանքս էլ կտամ, քույր իմ, քեզ համար սիրտս չի վախենա ոչ մի ցավից:", "seg_explanation": "Сестра моя бесценная и дорогая, ты — та, кому я доверяю, ради тебя я и жизнь отдам, сестра моя, ради тебя моё сердце не испугается никакой боли.", "word": "թանկագին,", "gloss": "дорогая", "note": null, "start": 1.839, "end": 2.639}, {"id": "w122", "video_id": "ashot_hvns_7668323436938349844", "handle": "ashot_hvns", "url": "https://www.tiktok.com/@ashot_hvns/video/7668323436938349844", "src": "https://videos.armenian.cc/video_ashot_hvns_7668323436938349844.mp4", "seg_text": "Դուք որ սրտից եք բողոքում, բա մենք ինչ ասենք, այ ցավը տանեմ։", "seg_explanation": "Вы еще на сердце жалуетесь, а что нам сказать, о горе мое.", "word": "մենք", "gloss": "мы", "note": null, "start": 25.979, "end": 26.259}, {"id": "w123", "video_id": "karine.armen4_7669785315049000199", "handle": "karine.armen4", "url": "https://www.tiktok.com/@karine.armen4/video/7669785315049000199", "src": "https://videos.armenian.cc/video_karine.armen4_7669785315049000199.mp4", "seg_text": "Մեկ էլ, ցավդ տանեմ, ըըը շուտ ասա, որ քարտս ուղարկեմ, տեղ եմ էթում էլի, կարա չհասցնեմ ուղարկեմ։", "seg_explanation": "И еще, возьму твою боль, э-э-э, быстро скажи, чтобы я отправил карту, я кое-куда иду, может не успею отправить.", "word": "ցավդ", "gloss": "возьму твою боль", "note": null, "start": 83.9, "end": 84.26}, {"id": "w124", "video_id": "zhanna_jaan_7655423811830992149", "handle": "zhanna_jaan", "url": "https://www.tiktok.com/@zhanna_jaan/video/7655423811830992149", "src": "https://videos.armenian.cc/video_zhanna_jaan_7655423811830992149.mp4", "seg_text": "Հեյ նորմալ մերը նորմալ քուրը հիսուն հիսուն ո՞ւմ է քաշել։", "seg_explanation": "Эй, нормальная мать, нормальная сестра, кого они по пятьдесят-пятьдесят обманули?", "word": "հիսուն", "gloss": "пятьдесят", "note": null, "start": 22.68, "end": 22.939}, {"id": "w125", "video_id": "karine.armen4_7669785315049000199", "handle": "karine.armen4", "url": "https://www.tiktok.com/@karine.armen4/video/7669785315049000199", "src": "https://videos.armenian.cc/video_karine.armen4_7669785315049000199.mp4", "seg_text": "Դու գրել ես պատասխանի՛, պատասխանի՛, ես էլ պատասխանել եմ, դու չես պատասխանում, խի՞ չես գրում։", "seg_explanation": "Ты написал «ответь», «ответь», я ответил, ты не отвечаешь, почему не пишешь?", "word": "Դու", "gloss": "ты", "note": null, "start": 113.64, "end": 113.71}, {"id": "w126", "video_id": "araratnews.am_7670171443564465429", "handle": "araratnews.am", "url": "https://www.tiktok.com/@araratnews.am/video/7670171443564465429", "src": "https://videos.armenian.cc/video_araratnews.am_7670171443564465429.mp4", "seg_text": "Ես, ես ուզում եմ դուք մի հատ, ես ուզում եմ մի հատ դուք պատկերացնեք էլի այդ աուրան՝ եկեղեցին, Հովիկ Աբովյանը, Սուրբ Հովհաննես եկեղեցին, Սերժ Սարգսյանը, կոնդակը, Գրիգոր Լուսավորիչը, խորհրդավոր ընթրիքը պատի վրա դա Վինչիին:", "seg_explanation": "Я, я хочу, чтобы вы, я хочу, чтобы вы представили эту ауру: церковь, Овик Абовян, церковь Святого Ованнеса, Серж Саргсян, указ, Григорий Просветитель, Тайная вечеря на стене у да Винчи.", "word": "վրա", "gloss": "на", "note": null, "start": 83.4, "end": 83.7}, {"id": "w127", "video_id": "nikol.pashinyan_pm_7624895708490992903", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7624895708490992903", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7624895708490992903.mp4", "seg_text": "Երանի նրանց, որ սրտով մաքուր են, որովհետև նրանք Աստծուն պիտի տեսնեն:", "seg_explanation": "Блаженны чистые сердцем, ибо они Бога узрят.", "word": "նրանց,", "gloss": "те", "note": null, "start": 44.319, "end": 44.719}, {"id": "w128", "video_id": "ashot_hvns_7648622753205177620", "handle": "ashot_hvns", "url": "https://www.tiktok.com/@ashot_hvns/video/7648622753205177620", "src": "https://videos.armenian.cc/video_ashot_hvns_7648622753205177620.mp4", "seg_text": "Տղա՛ ջան, էսի տալիս ես ես ի՞նչ անեմ, վեր կալ քցի կարոգի մեջ, վա՜հ։", "seg_explanation": "Сынок, ты даешь мне это, что мне делать? Возьми и брось в [урну] комиссии, уф.", "word": "տալիս", "gloss": "даешь", "note": null, "start": 51.719, "end": 52.039}, {"id": "w129", "video_id": "qristin77_7664194762899033352", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7664194762899033352", "src": "https://videos.armenian.cc/video_qristin77_7664194762899033352.mp4", "seg_text": "Տապշկեքն ա հագնում:", "seg_explanation": "Он надевает тапки.", "word": "հագնում:", "gloss": "тапочки надевает", "note": null, "start": 70.339, "end": 71.299}, {"id": "w130", "video_id": "foreverrr___3_7666927979880025364", "handle": "foreverrr___3", "url": "https://www.tiktok.com/@foreverrr___3/video/7666927979880025364", "src": "https://videos.armenian.cc/video_foreverrr___3_7666927979880025364.mp4", "seg_text": "Բա ինչի՞ ա մտածում, որ ես քեզ եմ սիրահարված:", "seg_explanation": "А почему он(а) думает, что я в тебя влюблен(а)?", "word": "որ", "gloss": "что", "note": null, "start": 29.019, "end": 29.079}, {"id": "w131", "video_id": "ritamamikonyan_7647510961544252680", "handle": "ritamamikonyan", "url": "https://www.tiktok.com/@ritamamikonyan/video/7647510961544252680", "src": "https://videos.armenian.cc/video_ritamamikonyan_7647510961544252680.mp4", "seg_text": "Էդքան լավ տղա ես, Կարապետյան Սամվել, էդքան կաշառքով, որ մարդ ես բերում Ռուսաստանից Հայաստան, որ քեզ ընտրեն, փողով, իհարկե:", "seg_explanation": "Раз ты такой «хороший парень», Самвел Карапетян, раз привозишь людей из России в Армению за такие взятки, чтобы за тебя проголосовали, конечно же, за деньги.", "word": "կաշառքով,", "gloss": "взятками", "note": null, "start": 4.119, "end": 4.659}, {"id": "w132", "video_id": "nikol.pashinyan_pm_7624895708490992903", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7624895708490992903", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7624895708490992903.mp4", "seg_text": "Երանի նրանց, որ սրտով մաքուր են, որովհետև նրանք Աստծուն պիտի տեսնեն:", "seg_explanation": "Блаженны чистые сердцем, ибо они Бога узрят.", "word": "նրանք", "gloss": "они", "note": null, "start": 46.559, "end": 46.979}, {"id": "w133", "video_id": "haykmarutyanofficial_7637943792519302420", "handle": "haykmarutyanofficial", "url": "https://www.tiktok.com/@haykmarutyanofficial/video/7637943792519302420", "src": "https://videos.armenian.cc/video_haykmarutyanofficial_7637943792519302420.mp4", "seg_text": "Ինչի՞ եք էդ երեխեքին ուղարկել պատերազմ, Դու՞ք եք է ուղարկել, դուք ձեր հրամանով են գնացել։", "seg_explanation": "Почему вы отправляли тех детей на войну? Вы сами их отправляли? Они по вашему приказу ушли?", "word": "էդ", "gloss": "тех", "note": null, "start": 116.02, "end": 116.12}, {"id": "w134", "video_id": "_dianavoskanyan_7652653653781826824", "handle": "_dianavoskanyan", "url": "https://www.tiktok.com/@_dianavoskanyan/video/7652653653781826824", "src": "https://videos.armenian.cc/video__dianavoskanyan_7652653653781826824.mp4", "seg_text": "Մենք ասում ենք. «Ղիա մա թայը, զեհեր ա փչում»:", "seg_explanation": "Мы говорим: «Мороз по коже, яд (холод) дует».", "word": "ա", "gloss": "очень холодно дует яд", "note": null, "start": 22.6, "end": 22.68}, {"id": "w135", "video_id": "ani_zaqaryan__7376652481406733584", "handle": "ani_zaqaryan_", "url": "https://www.tiktok.com/@ani_zaqaryan_/video/7376652481406733584", "src": "https://videos.armenian.cc/video_ani_zaqaryan__7376652481406733584.mp4", "seg_text": "Լուսացույցը սվետաֆորն է, այսինքն սվետաֆորի հայերեն համարժեքը լուսացույցն է։", "seg_explanation": "Светофор — это «светофор», то есть армянский эквивалент слова «светофор» — «лусацуйц».", "word": "հայերեն", "gloss": "армянский", "note": null, "start": 15.319, "end": 15.759}, {"id": "w136", "video_id": "asatryangurgen__7643116752305507591", "handle": "asatryangurgen_", "url": "https://www.tiktok.com/@asatryangurgen_/video/7643116752305507591", "src": "https://videos.armenian.cc/video_asatryangurgen__7643116752305507591.mp4", "seg_text": "Մի հատ անցար ստեղից, անցար, անցար, անցար։", "seg_explanation": "Ты прошел разок отсюда, прошел, прошел, прошел.", "word": "հատ", "gloss": "штука", "note": null, "start": 45.52, "end": 45.659}, {"id": "w137", "video_id": "nushohanian_7618280251872840982", "handle": "nushohanian", "url": "https://www.tiktok.com/@nushohanian/video/7618280251872840982", "src": "https://videos.armenian.cc/video_nushohanian_7618280251872840982.mp4", "seg_text": "Այ՜, այ՜, այ՜:", "seg_explanation": "Ой, ой, ой!", "word": "այ՜,", "gloss": "ай", "note": null, "start": 57.239, "end": 57.299}, {"id": "w138", "video_id": "abcmedia.am_7657222046253911316", "handle": "abcmedia.am", "url": "https://www.tiktok.com/@abcmedia.am/video/7657222046253911316", "src": "https://videos.armenian.cc/video_abcmedia.am_7657222046253911316.mp4", "seg_text": "Ru ID հավելվածի միջոցով յուրաքանչյուր օտարերկրացու համար ձևավորվում է թվային պրոֆիլ, որը հետագայում կարող է գործածվել պետական ծառայությունից օգտվելիս և միգրացիոն տարբեր գործընթացներում։", "seg_explanation": "С помощью приложения Ru ID для каждого иностранца формируется цифровой профиль, который в дальнейшем может быть использован при получении государственных услуг и в различных миграционных процессах.", "word": "պրոֆիլ,", "gloss": "профиль", "note": null, "start": 77.979, "end": 78.559}, {"id": "w139", "video_id": "772abc_7669701066363047201", "handle": "772abc", "url": "https://www.tiktok.com/@772abc/video/7669701066363047201", "src": "https://videos.armenian.cc/video_772abc_7669701066363047201.mp4", "seg_text": "Ասում ա պանիխիդային այնքան շատ մարդ ա լինում, մեռելին երկու տեղով են դնում։", "seg_explanation": "Говорят, на панихиде так много народу, что покойника кладут в двух местах.", "word": "տեղով", "gloss": "местах", "note": null, "start": 6.42, "end": 6.779}], "phrases": [{"id": "p000", "video_id": "nikol.pashinyan_pm_7562576540278508820", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7562576540278508820", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7562576540278508820.mp4", "seg_text": "Մի հեկտար հազար մետրից երեսունհինգ ստանալու ես նորմալ ա։", "explanation": "Получить тридцать пять с тысячи квадратных метров — это нормально.", "start": 19.359, "end": 22.68}, {"id": "p001", "video_id": "bazhukovfamily_7661153418660138261", "handle": "bazhukovfamily", "url": "https://www.tiktok.com/@bazhukovfamily/video/7661153418660138261", "src": "https://videos.armenian.cc/video_bazhukovfamily_7661153418660138261.mp4", "seg_text": "Ես Արինեն եմ, ինձ վեց տարեկան է, լավ հայերեն եմ խոսում։", "explanation": "Я Арине, мне шесть лет, я хорошо говорю по-армянски.", "start": 62.099, "end": 67.0}, {"id": "p002", "video_id": "shadowride3_7662663697118039317", "handle": "shadowride3", "url": "https://www.tiktok.com/@shadowride3/video/7662663697118039317", "src": "https://videos.armenian.cc/video_shadowride3_7662663697118039317.mp4", "seg_text": "Հա՜, լսե՛ք, նայի՛ հասել ես, վրատ, ես քեզ չէի ճանաչում, բայց տղու բենից հելածը տղու բենից ա, չէ՞։", "explanation": "Да, слушайте, смотри, ты доехал, брат, я тебя не знал, но слова мужчины остаются словами мужчины, да?", "start": 74.22, "end": 81.18}, {"id": "p003", "video_id": "novax3160_7666173171308989728", "handle": "novax3160", "url": "https://www.tiktok.com/@novax3160/video/7666173171308989728", "src": "https://videos.armenian.cc/video_novax3160_7666173171308989728.mp4", "seg_text": "Հայրիկ, մայրիկ, Ես որոշեցի ընկերներիս հետ գնամ պատերազմ։", "explanation": "Папа, мама, я решил пойти на войну со своими друзьями.", "start": 0.0, "end": 4.42}, {"id": "p004", "video_id": "nareh.hovsepian_7669823719195282708", "handle": "nareh.hovsepian", "url": "https://www.tiktok.com/@nareh.hovsepian/video/7669823719195282708", "src": "https://videos.armenian.cc/video_nareh.hovsepian_7669823719195282708.mp4", "seg_text": "Համարյա հասնում էի իրան, պայուսակս բացեց, դրամապանակս մեջից հանեց, մակբուքս շպրտեց պոլերին ու փախավ։", "explanation": "Я почти догнал его, он открыл мою сумку, вытащил кошелек, бросил макбук на пол и убежал.", "start": 28.939, "end": 38.219}, {"id": "p005", "video_id": "nikol.pashinyan_pm_7562576540278508820", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7562576540278508820", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7562576540278508820.mp4", "seg_text": "Շնորհակալություն վարչապետ ջան, լավ։", "explanation": "Спасибо, господин премьер-министр, хорошо.", "start": 7.279, "end": 10.46}, {"id": "p006", "video_id": "qristin77_7636115137736527111", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7636115137736527111", "src": "https://videos.armenian.cc/video_qristin77_7636115137736527111.mp4", "seg_text": "Չի կարելի տենց գոռալ, աղջիկ ջան։", "explanation": "Нельзя так кричать, девочка.", "start": 53.18, "end": 56.28}, {"id": "p007", "video_id": "aimusicx_01_7657848404281789704", "handle": "aimusicx_01", "url": "https://www.tiktok.com/@aimusicx_01/video/7657848404281789704", "src": "https://videos.armenian.cc/video_aimusicx_01_7657848404281789704.mp4", "seg_text": "Վեց վարկ ունեմ, յոթը պարի, ութն էլ սգում եմ, մեկը բանկից, մեկը օնլայն, ես էլ փող չունեմ:", "explanation": "У меня шесть кредитов, семь на танцы (в долг), восьмой же — плачу (оплачиваю), один из банка, один онлайн, а у меня денег нет.", "start": 7.399, "end": 15.099}, {"id": "p008", "video_id": "harutyunyans_blog_7670100789636893972", "handle": "harutyunyans_blog", "url": "https://www.tiktok.com/@harutyunyans_blog/video/7670100789636893972", "src": "https://videos.armenian.cc/video_harutyunyans_blog_7670100789636893972.mp4", "seg_text": "Ռուզաննա սաղի հետ առավոտյան կոֆե է խմում։", "explanation": "Рузанна по утрам пьет кофе со всеми.", "start": 13.179, "end": 15.
