<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<title>armenian.cc — sentence translation eval</title><style>
:root{--bg:#0f1115;--card:#1a1d24;--fg:#e8eaed;--mut:#9aa0aa;--acc:#58a6ff;--line:#2b2f38;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:16px;align-items:center}
h1{font-size:15px;margin:0}.bar{flex:1;height:8px;background:var(--card);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);width:0}
.wrap{max-width:780px;margin:0 auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.play{padding:10px 16px;border-radius:8px;border:1px solid var(--acc);background:#12233b;color:var(--acc);cursor:pointer;font-size:15px}
.am{font-size:21px;margin:10px 0}.mt{font-size:17px;color:var(--mut);padding:10px;background:#0d0f13;border-radius:8px;border:1px solid var(--line)}
textarea{width:100%;min-height:80px;margin-top:6px;padding:12px;border-radius:8px;border:1px solid var(--line);background:#0d0f13;color:var(--fg);font-size:18px;line-height:1.55}
.small{font-size:12px;color:var(--mut)}.btns{display:flex;gap:8px;margin-top:12px}
button.opt{flex:1;padding:12px;border-radius:9px;border:1px solid var(--line);background:#20242d;color:var(--fg);cursor:pointer;font-size:15px}
.opt.sel{outline:2px solid #fff}.ok{background:#12331c;border-color:var(--ok)}.acc{background:#3a3212;border-color:var(--warn)}.bad{background:#3a1615;border-color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}.nav button{padding:12px 20px;border-radius:9px;border:1px solid var(--line);background:#20242d;color:var(--fg);cursor:pointer;font-size:15px}
.primary{background:var(--acc)!important;color:#000!important;font-weight:600}a{color:var(--acc)}</style></head><body>
<header><h1>Sentence translation eval — rate + give a correct reference</h1><div class="bar"><i id="prog"></i></div><span class="small" id="count"></span><button class="play" onclick="exportJSON()">⬇ Export</button></header>
<div class="wrap" id="app"></div><audio id="au"></audio><script>
const DATA=[{"id": "p000", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7562576540278508820", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7562576540278508820.mp4", "seg_text": "Մի հեկտար հազար մետրից երեսունհինգ ստանալու ես նորմալ ա։", "explanation": "Получить тридцать пять с тысячи квадратных метров — это нормально.", "start": 19.359, "end": 22.68}, {"id": "p001", "handle": "bazhukovfamily", "url": "https://www.tiktok.com/@bazhukovfamily/video/7661153418660138261", "src": "https://videos.armenian.cc/video_bazhukovfamily_7661153418660138261.mp4", "seg_text": "Ես Արինեն եմ, ինձ վեց տարեկան է, լավ հայերեն եմ խոսում։", "explanation": "Я Арине, мне шесть лет, я хорошо говорю по-армянски.", "start": 62.099, "end": 67.0}, {"id": "p002", "handle": "shadowride3", "url": "https://www.tiktok.com/@shadowride3/video/7662663697118039317", "src": "https://videos.armenian.cc/video_shadowride3_7662663697118039317.mp4", "seg_text": "Հա՜, լսե՛ք, նայի՛ հասել ես, վրատ, ես քեզ չէի ճանաչում, բայց տղու բենից հելածը տղու բենից ա, չէ՞։", "explanation": "Да, слушайте, смотри, ты доехал, брат, я тебя не знал, но слова мужчины остаются словами мужчины, да?", "start": 74.22, "end": 81.18}, {"id": "p003", "handle": "novax3160", "url": "https://www.tiktok.com/@novax3160/video/7666173171308989728", "src": "https://videos.armenian.cc/video_novax3160_7666173171308989728.mp4", "seg_text": "Հայրիկ, մայրիկ, Ես որոշեցի ընկերներիս հետ գնամ պատերազմ։", "explanation": "Папа, мама, я решил пойти на войну со своими друзьями.", "start": 0.0, "end": 4.42}, {"id": "p004", "handle": "nareh.hovsepian", "url": "https://www.tiktok.com/@nareh.hovsepian/video/7669823719195282708", "src": "https://videos.armenian.cc/video_nareh.hovsepian_7669823719195282708.mp4", "seg_text": "Համարյա հասնում էի իրան, պայուսակս բացեց, դրամապանակս մեջից հանեց, մակբուքս շպրտեց պոլերին ու փախավ։", "explanation": "Я почти догнал его, он открыл мою сумку, вытащил кошелек, бросил макбук на пол и убежал.", "start": 28.939, "end": 38.219}, {"id": "p005", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7562576540278508820", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7562576540278508820.mp4", "seg_text": "Շնորհակալություն վարչապետ ջան, լավ։", "explanation": "Спасибо, господин премьер-министр, хорошо.", "start": 7.279, "end": 10.46}, {"id": "p006", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7636115137736527111", "src": "https://videos.armenian.cc/video_qristin77_7636115137736527111.mp4", "seg_text": "Չի կարելի տենց գոռալ, աղջիկ ջան։", "explanation": "Нельзя так кричать, девочка.", "start": 53.18, "end": 56.28}, {"id": "p007", "handle": "aimusicx_01", "url": "https://www.tiktok.com/@aimusicx_01/video/7657848404281789704", "src": "https://videos.armenian.cc/video_aimusicx_01_7657848404281789704.mp4", "seg_text": "Վեց վարկ ունեմ, յոթը պարի, ութն էլ սգում եմ, մեկը բանկից, մեկը օնլայն, ես էլ փող չունեմ:", "explanation": "У меня шесть кредитов, семь на танцы (в долг), восьмой же — плачу (оплачиваю), один из банка, один онлайн, а у меня денег нет.", "start": 7.399, "end": 15.099}, {"id": "p008", "handle": "harutyunyans_blog", "url": "https://www.tiktok.com/@harutyunyans_blog/video/7670100789636893972", "src": "https://videos.armenian.cc/video_harutyunyans_blog_7670100789636893972.mp4", "seg_text": "Ռուզաննա սաղի հետ առավոտյան կոֆե է խմում։", "explanation": "Рузанна по утрам пьет кофе со всеми.", "start": 13.179, "end": 15.759}, {"id": "p009", "handle": "qristin77", "url": "https://www.tiktok.com/@qristin77/video/7664194762899033352", "src": "https://videos.armenian.cc/video_qristin77_7664194762899033352.mp4", "seg_text": "Մամ, դե ման ցիգը մամոտ ա:", "explanation": "Мам, ну [это] близко.", "start": 52.739, "end": 54.179}, {"id": "p010", "handle": "vaag_mk", "url": "https://www.tiktok.com/@vaag_mk/video/7626369781670710536", "src": "https://videos.armenian.cc/video_vaag_mk_7626369781670710536.mp4", "seg_text": "Էռնա՛, ես քեզ հետա կզանգեմ:", "explanation": "Эрна, я тебе перезвоню.", "start": 32.459, "end": 34.779}, {"id": "p011", "handle": "nikol.pashinyan_pm", "url": "https://www.tiktok.com/@nikol.pashinyan_pm/video/7456684966747835655", "src": "https://videos.armenian.cc/video_nikol.pashinyan_pm_7456684966747835655.mp4", "seg_text": "Որ բան, որ կարծեմ հա բոլ-բոլ։", "explanation": "Ну, то, что, кажется, да, предостаточно.", "start": 30.519, "end": 34.799}, {"id": "p012", "handle": "abcmedia.am", "url": "https://www.tiktok.com/@abcmedia.am/video/7657222046253911316", "src": "https://videos.armenian.cc/video_abcmedia.am_7657222046253911316.mp4", "seg_text": "Մուտքի հայտը պետք է ներկայացնել ոչ շուտ, քան իննսուն օր և ոչ ուշ, քան յոթանասուներկու ժամ մինչև սահմանը հատելը։", "explanation": "Заявку на въезд необходимо подать не ранее чем за девяносто дней и не позднее чем за семьдесят два часа до пересечения границы.", "start": 14.859, "end": 22.7}, {"id": "p013", "handle": "haykmarutyanofficial", "url": "https://www.tiktok.com/@haykmarutyanofficial/video/7637943792519302420", "src": "https://videos.armenian.cc/video_haykmarutyanofficial_7637943792519302420.mp4", "seg_text": "Մերը չի եղել։", "explanation": "Она не была нашей.", "start": 20.45, "end": 21.88}, {"id": "p014", "handle": "ashot_hvns", "url": "https://www.tiktok.com/@ashot_hvns/video/7617127410168810773", "src": "https://videos.armenian.cc/video_ashot_hvns_7617127410168810773.mp4", "seg_text": "Ես քաղցր, ես կնիկ չունեմ:", "explanation": "Мне сладкий, у меня нет жены.", "start": 52.18, "end": 54.84}, {"id": "p015", "handle": "kamillayic", "url": "https://www.tiktok.com/@kamillayic/video/7666101852534082824", "src": "https://videos.armenian.cc/video_kamillayic_7666101852534082824.mp4", "seg_text": "Բարի մարդիկ, սիրուն դիկ նայեք։", "explanation": "Добрые люди, посмотрите на красоту.", "start": 73.919, "end": 76.934}, {"id": "p016", "handle": "lily_bagratuni", "url": "https://www.tiktok.com/@lily_bagratuni/video/7646105736002522389", "src": "https://videos.armenian.cc/video_lily_bagratuni_7646105736002522389.mp4", "seg_text": "Երկու կողմից կարմրեցնում ենք մինչև այսպես անուշ ոսկեգունելը, նույնպես տեղավորում ենք անձեռոցիկի վրա։", "explanation": "С двух сторон подрумяниваем до такого приятного золотистого цвета, также выкладываем на салфетку.", "start": 97.44, "end": 102.99}, {"id": "p017", "handle": "haykmarutyanofficial", "url": "https://www.tiktok.com/@haykmarutyanofficial/video/7644609969010248981", "src": "https://videos.armenian.cc/video_haykmarutyanofficial_7644609969010248981.mp4", "seg_text": "Խաշլաման թող ձեր անունից։", "explanation": "Пусть хашлама будет от вашего имени.", "start": 25.439, "end": 28.279}, {"id": "p018", "handle": "uxi.am", "url": "https://www.tiktok.com/@uxi.am/video/7668004175040711957", "src": "https://videos.armenian.cc/video_uxi.am_7668004175040711957.mp4", "seg_text": "Վոլեյբոլ և բասկետբոլ խաղալու հնարավորություն:", "explanation": "Возможность поиграть в волейбол и баскетбол.", "start": 27.059, "end": 29.299}, {"id": "p019", "handle": "arm_mation", "url": "https://www.tiktok.com/@arm_mation/video/7628982596424322336", "src": "https://videos.armenian.cc/video_arm_mation_7628982596424322336.mp4", "seg_text": "Ես գնում եմ:", "explanation": "Я ухожу.", "start": 5.759, "end": 7.799}];const KEY='armcc_sent_v1';let R=JSON.parse(localStorage.getItem(KEY)||'{}');
let i=DATA.findIndex(x=>!(R[x.id]&&R[x.id].rating));if(i<0)i=0;const au=document.getElementById('au');
function play(it){if(!it.src)return;au.src=it.src;const s=Math.max(0,(it.start||0)-0.15),e=(it.end||s+6)+0.4;au.currentTime=s;au.play();const st=()=>{if(au.currentTime>=e){au.pause();au.removeEventListener('timeupdate',st);}};au.addEventListener('timeupdate',st);}
function setR(id,k,v){R[id]={...(R[id]||{}),[k]:v};localStorage.setItem(KEY,JSON.stringify(R));draw();}
function draw(){const done=DATA.filter(x=>R[x.id]&&R[x.id].rating).length;document.getElementById('prog').style.width=(100*done/DATA.length)+'%';document.getElementById('count').textContent=done+'/'+DATA.length;
const it=DATA[i],r=R[it.id]||{};const ref=(r.reference!==undefined)?r.reference:it.explanation;
document.getElementById('app').innerHTML=`<div class="card"><div class="small">sentence ${i+1}/${DATA.length} · @${it.handle||''}</div>
<div style="margin:8px 0"><button class="play" id="pl">▶ play clip</button> <span class="small">(P)</span></div>
<div class="am">${it.seg_text}</div>
<div class="small">model translation:</div><div class="mt">${it.explanation}</div>
<div class="btns">
<button class="opt ok ${r.rating==='faithful'?'sel':''}" onclick="setR('${it.id}','rating','faithful')">✓ Faithful (1)</button>
<button class="opt acc ${r.rating==='minor'?'sel':''}" onclick="setR('${it.id}','rating','minor')">≈ Minor (2)</button>
<button class="opt bad ${r.rating==='major'?'sel':''}" onclick="setR('${it.id}','rating','major')">✗ Major (3)</button></div>
<div class="small" style="margin-top:12px">Correct Russian translation (edit to a faithful reference — used for chrF++):</div>
<textarea id="ta">${ref.replace(/</g,'&lt;')}</textarea>
<div class="small" style="margin-top:8px"><a href="${it.url}" target="_blank">↗ open TikTok</a></div>
<div class="nav"><button onclick="go(-1)">← Prev</button><button class="primary" id="next">Save & Next →</button></div></div>`;
const ta=document.getElementById('ta');
ta.oninput=()=>{R[it.id]={...(R[it.id]||{}),reference:ta.value};localStorage.setItem(KEY,JSON.stringify(R));};
document.getElementById('pl').onclick=()=>play(it);
document.getElementById('next').onclick=()=>{R[it.id]={...(R[it.id]||{}),reference:ta.value};if(!R[it.id].rating)R[it.id].rating='faithful';localStorage.setItem(KEY,JSON.stringify(R));go(1);};}
function go(d){au.pause();i=Math.max(0,Math.min(DATA.length-1,i+d));draw();scrollTo(0,0);}
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'){if(e.key==='Escape')e.target.blur();return;}const it=DATA[i];if(e.key==='1')setR(it.id,'rating','faithful');if(e.key==='2')setR(it.id,'rating','minor');if(e.key==='3')setR(it.id,'rating','major');if(e.key==='p'||e.key==='P')play(it);if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
function exportJSON(){const out={labeled_at:new Date().toISOString(),sentences:R};const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sentence_refs.json';a.click();}
draw();</script></body></html>
